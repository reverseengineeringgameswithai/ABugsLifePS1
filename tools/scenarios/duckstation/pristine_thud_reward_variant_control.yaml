schema_version: 1
id: pristine_thud_reward_variant_control
description: >-
  Replay the centrally pinned pristine-serial Thud recording to an identical
  target-970 origin, change only the save-owned derived countdown from 9 to 6,
  and assert that the next native allocation takes the equality-to-five action-9
  health-leaf variant instead of the natural action-20 grain variant.
target:
  disc: ~/Downloads/ABL/Disney-Pixar A Bug's Life (v1.0).cue
  expected_serial: SCUS-94288
launch: {profile: generic}
playback:
  movie: thud_boss_movie.movie.json
  load_start_state: true
  require_reproducible: true
phases:
  - id: thud_reward_variant_origin
    trigger: {type: movie_frame, target: 969, max_frames: 980, timeout_seconds: 180}
    assertions:
      - {id: volley_origin_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 14}
      - {id: volley_origin_counter, type: memory, address: 0x800B4CC8, width: u32, op: eq, expected: 1}
      - {id: volley_origin_countdown, type: memory, address: 0x800B4CB4, width: u32, op: eq, expected: 9}
      - {id: volley_origin_movie_reproducible, type: rpc, method: movie.status, path: reproducible, op: eq, expected: true}
    after:
      - type: rpc
        id: select_only_thud_equality_to_five_variant
        method: debugger.writeU32
        params: {address: 0x800B4CB4, value: 6}
  - id: thud_reward_action9_variant
    trigger: {type: movie_frame, target: 970, max_frames: 2, timeout_seconds: 60}
    assertions:
      - {id: volley_variant_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 14}
      - {id: volley_variant_countdown, type: memory, address: 0x800B4CB4, width: u32, op: eq, expected: 5}
      - {id: volley_variant_slot17_action, type: memory, address: 0x800B10F0, width: u8, op: eq, expected: 9}
      - {id: volley_variant_slot17_ttl, type: memory, address: 0x800B10F2, width: u16, op: eq, expected: 200}
      - {id: volley_variant_slot17_state, type: memory, address: 0x800B10FC, width: s16, op: eq, expected: -42}
      - {id: volley_variant_slot17_class, type: memory, address: 0x800B1104, width: u8, op: eq, expected: 128}
      - {id: volley_variant_movie_reproducible, type: rpc, method: movie.status, path: reproducible, op: eq, expected: true}
