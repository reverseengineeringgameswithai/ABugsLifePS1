description: >
  Static closure-frontier contract for the E08 type-word classes that still
  lack a native outcome control. The producer derives the class universe from
  the actor/source catalog, partitions it with the retained native-control
  aggregate, joins every remaining class to the decoded E07 VM program and
  resident callback census, and orders live leads with retained frame evidence.
  It never assigns a semantic owner or promotes frame correlation to causality.
