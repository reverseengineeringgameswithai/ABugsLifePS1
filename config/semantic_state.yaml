  - id: original.training_step
    namespace: original
    kind: overlay_field
    address: 0x800B4A3C
    # Overlay VAs are shared: the key is (namespace, image, address), not the address.
    # This image is the one the entry's own invariant already names, and containment
    # confirms it -- LEVEL07/LEVEL1.BIN spans 0x800B39A0..0x800B4A90, so it holds this
    # VA, while both LEVEL01 images end before it (0x800B4030 / 0x800B442C).
    image: LEVEL07_LEVEL1
    width: s32
    owner: original_game.training_overlay
    writers:
      # ⚠️ CORRECTED 2026-08-11. The previously declared writer 0x800B477C is a `lui`
      # (0x3C02800B -- address setup), not a store, in all 20 censused images. The real
      # stores were measured from the overlay bytes and independently re-decoded:
      # 0x800B3DA0 = 0xAC204A3C (sw zero) and 0x800B47E0 = 0xAC234A3C (sw v1), both
      # targeting offset 0x4A3C. 1 declared vs 2 measured, and the declared one was not
      # among them. analysis/phase3_xrefs.json had flagged it unverifiable ("Verifying it
      # needs the overlay blob"); the blob check is now done.
      - address: 0x800B3DA0
        name: level_state_writer_zeroing_init
      - address: 0x800B47E0
        name: level_transition_handler_increment
    invariants:
      - kind: range
        min: 0
        max: 13
        context: >-
          Training overlay loaded (LEVEL07/LEVEL1.BIN @ 0x800B39A0). Range holds for THIS
          overlay: observed 2 and 13 in the two pristine fixtures, and the field indexes a
          14-arm dispatch table at 0x800B39A4 whose span equals the range span.
          ⚠️ THE ADDRESS IS NOT UNIQUE. Overlay-local VAs are keyed globally here with no
          image field, and 0x800B4A3C is also real written state in LEVEL02_LEVEL1.BIN
          (3 refs, 2 stores), which routes via the progression table to F11_the_tree --
          where it was measured at 0..320 over 1,896 writes, far outside this range. Three
          rows have now collided on this entry (E07 / F00 / F11). The range is scoped to
          the training overlay and must not be read as a property of the address.
    confidence: confirmed
    evidence:
      - src_re/training_tutorial_progression.c
      - ObsidianVault/Canon/Systems/Training_NPC_progression.md
      - analysis/phase4_f00_written_bar_assessment.json

