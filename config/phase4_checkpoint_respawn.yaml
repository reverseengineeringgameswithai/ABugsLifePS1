ownership_boundaries:
  owned_now:
    - The player+0x50/+0x54/+0x58 fields are a gated continuously maintained safe anchor, not proof of a player-activated checkpoint.
    - The resident respawn handler statically reads that anchor and writes live XYZ before restoring health and decrementing lives.
    - Recorded LEVEL02 movement causally selects one pit reset; neutral input prevents the respawn handler while the broader airborne/fall region still executes.
    - This LEVEL02 pit path converges after a frame-100 anchor mutation even when the three continuous anchor stores are suppressed.
    - At frame 157, pristine overlay 0x800B3C54 selects nearest runtime row 6, writes safe XYZ, and resident 0x8005B134 immediately copies that tuple to live XYZ.
    - A selected-row raw-X-only +128 branch causes safe/live X +4096 under identical one-frame input and identical owner/handler execution coverage.
    - Clearing only player status mask 0x0010 at the exact frame-156 boundary denies every LEVEL03 safe-XYZ selector store while the coverage-identical resident handler consumes the prior safe anchor.
    - On the Bug Bar contact-death path, a fatal-state safe-X-only +4096 branch causes first-completed-respawn safe/live X +4096 while Y/Z, health/lives, scene and exact updater/handler/overlay coverage remain unchanged.
    - In live scenes 10 and 4, one-frame pit boundaries execute the resident safe-to-live chain, restore/decrement their typed health/lives state, and replace a safe-X-only +4096 perturbation without executing the continuous safe-XYZ stores.
    - Scene 10 executes the exact pristine LEVEL10 0x800B3ADC function: four complete writes select scaled row X/Z and ground-derived Y while preserving heading.
    - Scene 4 executes the exact pristine LEVEL04 0x800B3C5C function: five complete writes install fixed X/Z/heading and ground-derived Y.
    - Scene 6 selects and executes the exact pristine LEVEL06 0x800B3AEC fixed initializer: four complete stores install safe XYZ/heading, and four same-entry instruction controls independently confirm those field effects.
    - Scene 8 selects and executes the exact pristine LEVEL08 0x800B3AE8 fixed initializer: seven complete stores install safe XYZ/heading plus live XYZ, while X-source and heading-source controls independently confirm those field effects.
    - A pristine from-boot scene-3 replay proves 0x80096DA4 is shared DAT type-table slot 1. The resident parser points it at LEVEL03/LEVEL.DAT offset 0x458, and selected row 6 is byte-identical at file offset 0x4A4/runtime 0x8015E6D0 before the retained causal row mutation changes safe/live X.
  still_open:
    - Source and general activation policy of status mask 0x0010, denial behavior in other row-selecting variants, plus reset scope.
    - Indirect/additional overlay variants, actor, scripted and exceptional death classes plus remaining-stage, save/load and scene-transition breadth.
  dependency_boundary: >-
    C16 owns lives/game-over/Continue policy, E10 owns hazard-family policy,
    E02 owns collision inputs, and E16 owns overlay/resource loading. Their
    interfaces are dependencies and do not confer C15 completion.

mod_contract:
  owner: Preserve continuous updater, shared DAT type-table construction, residency-qualified LEVEL03/LEVEL10/LEVEL04/LEVEL06/LEVEL08 transition writers and resident consumer ordering; overlay addresses and authored DAT rows are residency/scene-qualified and must be hash-verified before any hook.
  readers: Enumerate anchor readers in respawn, warp, collision and transition code; never infer ownership from a field nickname.
  writers: Preserve the three gated continuous stores, LEVEL03 row-selector stores, LEVEL10 row/ground stores, LEVEL04 fixed/ground/heading stores, LEVEL06 fixed safe-tuple stores and LEVEL08 fixed safe/live-tuple stores; enumerate other overlay variants before adding a checkpoint mechanic.
  valid_domains: XYZ values are signed s32; heading is signed storage with a native 12-bit angular domain; the updater clears/sets shared-status bit 0x0008 and the reproduced overlay selector gates on bit 0x0010, but this campaign does not assign whole-word semantics.
  initialization: Initialize live and anchor state from a verified scene owner before any respawn consumer runs.
  reset: Preserve resident safe-anchor consumption on the reproduced Bug Bar contact death, the scene-3 selector's authored type-0x01 row input, and the exact scene-3 status-mask denial path; define mask source/general policy, other row-selector denial, other death-class, scene-load, save-load and frontend reset policy explicitly.
  retirement: Retire transient transition and overlay references before scene replacement; re-arm all instrumentation after state load.
  consumers: Player lifecycle, collision, hazard, HUD, frontend, persistence and overlay-loading campaigns.
