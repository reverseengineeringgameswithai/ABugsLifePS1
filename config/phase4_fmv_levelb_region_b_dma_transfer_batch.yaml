      Both jobs replay the same pristine cold-boot LEVEL01 movie with only
      transferLog.start armed and no guest perturbation. Complete ordered
      transfer streams and terminal frame, cycle, registers, RAM, movie,
      callback, scene and Region-B state must match. Any truncation, missing
      pagination or endpoint/event drift rejects the ownership claim.

