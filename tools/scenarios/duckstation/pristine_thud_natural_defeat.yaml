      - {id: thud_contact_action, type: memory, address: 0x800B12E8, width: u8, op: eq, expected: 2}
      - {id: thud_contact_class, type: memory, address: 0x800B12FC, width: u8, op: eq, expected: 0}
      - {id: thud_overlay_target_pre, type: memory, address: 0x800B4C70, width: u32, op: eq, expected: 50}
  - id: thud_contact_damage
