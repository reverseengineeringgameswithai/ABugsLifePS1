    mod_contract:
      owner: Preserve save-qualified Thud allocation order, fixed contact-pool ownership, resident renderer packet order and lifecycle; explicitly name every hook.
      readers: Enumerate action, active gate, flags, position, dimensions, subtype, mode, command/color word, computed ordering depth/table link, primitive buffer, texture/CLUT, GPU, camera, audio and lifecycle consumers.
