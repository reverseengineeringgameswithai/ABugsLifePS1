    family: player_lifecycle
    rows: [C16_lives_gameover]
    status: active
    scope: >
      Resident health/lives damage and death selection, ordinary respawn,
      final-life game over, post-game-over title restart, frontend/card interfaces, death-class
      breadth, checkpoint coupling and stage lifecycle.
    non_scope: >
      C15 owns checkpoint source/capture/restore; E10 owns hazard-family policy;
      E14 owns native card serialization; E15 owns FMV playback; E16 owns the
      generic overlay/resource loader. Their interfaces are dependencies, not
      C16 completion inherited by this campaign.
    exit_decision: >
      Active and incomplete. A dedicated pristine Bug Bar recording now proves
      natural final-life game over, a one-byte ordinary-respawn control, a
      neutral-input no-death control, and a fourth-Start title-restart lives
      reset through exact resident writers. Fresh isolated-card evidence now
      corrects the former Continue label: removing Start leaves the title path
      at lives 0, while natural input reaches stage select at lives 5; neither
      branch changes the 336-byte progress block or isolated card. An existing
      LEVEL02 pit movie adds a
      second-stage 3/5-to-4/4 natural death/reset and input-negative control.
      The same ordinary contact path now also has a single-variable safe-anchor
      consumption proof. Eight existing natural damage leads additionally join
      four ordinary respawns and one final-life selection to the exact resident
      law across five scene values; three other leads remain bounded nonfatal
      damage. The existing Hopper-showdown pair adds a scene-15 boss-context
      final-life path whose exact fatal caller is resident proximity contact,
      without attributing damage to Hopper or completing D20/F15. The existing
      Bonus-3 pair adds a scene-3 context one-field death control: the same
      proximity-contact call changes health 0 to -1/master state 2, then the
      resident ordinary-respawn law restores health 4 and decrements lives 5
      to 4. It assigns no named enemy and does not complete F18. The complete
      Thumper pair adds a scene-2 boss-actor control: the natural and fatal
      branches enter the identical proximity call with s1 naming live pool slot
      1/id 16/Thumper callback and backlink; the fatal branch reaches ordinary
      respawn health/lives 4/3 without completing D16 or F03. The complete
      Thud pair adds a scene-14 arena control: row 4 is the sole in-threshold
      row at the exact overlay damage caller, and a one-byte health control
      turns the natural 3-to-2 contact into final-life health -1/master state 2
      while lives stays 0. This does not promote a scripted/special/exceptional
      class or complete D18/F09. The pristine Riverbed Flight anchor adds one
      scene-8 actor-owned proximity path: corrected pool slot 5/id 37 owns the
      exact 0x8004B4A0 call, natural death respawns at health/lives 4/2, and a
      matched one-byte response-only control suppresses damage without endpoint
      timing drift. Type word 0x0125 remains unclassified, so this does not name
      a species, promote a special death law, or complete C16/F14. Remaining
      trigger/actor ownership, scripted/setpiece/exceptional classes, other
      bonus contexts,
      explicit native Save/Load and other frontend paths plus remaining campaign
      breadth still intersect C16.
