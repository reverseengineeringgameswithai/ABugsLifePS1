schema: abl-phase4-extent-audit-acknowledged/1
reviewed: '2026-08-06'
purpose: Rows a human has looked at. The audit fails on anything NOT here, so a newly typed truncation
  is caught while the reviewed ones stay quiet. Removing a row makes the audit fail again -- that is the
  point.
verdict_meanings:
  not_an_extent: the address pair is not a start/end range at all
  drift_pin_covers_less_than_the_function: a real truncation, but the range feeds a sha256 pin rather
    than a scan. The pin still detects drift inside what it covers; it cannot see the tail. NOT the F01
    bug, which made a CENSUS report a lower bound as a total.
  decomp_segment_not_a_census_extent: a config/segments.yml ASM segment boundary, which tracks the decomp
    build's source cuts rather than the function census
