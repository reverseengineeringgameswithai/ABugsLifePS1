    run: *shared_run
    capture: *precise_capture

control_pairs:
  - positive_job: file_open_failure_forced_positive
    negative_job: file_open_failure_native_negative
    assertion: >-
      From the identical inspected E15 movie-start-state anchor, both branches
      advance input and guest execution to frame 170 after FMV.BIN is resident
      but before the frame-183 selected-limit publication. The positive changes
      only 0x800B6DE8 from beq s0,v0 to an unconditional branch with the same
      0x800B6E4C target; the native negative retains the original word. Only
      the positive may call the failure diagnostic from 0x800B6E54, and both
      branches must reach shared initialization at 0x800B6E68 without
      saturation. A second changed word, missing shared initialization,
      failure-route entry in the native branch or unrelated endpoint
      divergence rejects the routing claim.

