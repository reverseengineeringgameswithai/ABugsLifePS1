    scope: >
      Pristine FMV.BIN manifest and frame-count dispatch, resident shell/load
      bridge, Region-B playback state, stream/decode coverage, Start skip,
      natural completion, error paths, pause/stop and transition lifecycle.
    non_scope: >
      E12 owns general SFX/voice/XA/music policy; C17 owns movie-viewer unlock
      and selection; E14 owns frontend persistence; E16 owns the generic
      overlay/resource loader. Their interfaces are dependencies, not E15
      completion inherited from this campaign.
    exit_decision: >
      Active and incomplete. One LEV1A state anchor causally proves native Start
      skip; neutral cold boot naturally completes dlogo, title and intro through
      Region-B reuse, retirement and the scene-1 frontend. Pristine static bytes
      now bind all 47 selector targets, all nine direct resident loader calls,
      both complete 16-byte level A/B tables, the 50-call player frontier and
      every completion-request xref. All important player-boundary fields now
      have exact widths, signed views, xrefs, aliases and lifecycle rules.
      Selector 2 is a reviewed unreachable pristine manifest row after a
      complete 23-image computed-target scan, not an indirect movie-viewer
      path. Complete-frontier is now met: exact pristine opcodes and exhaustive
      call censuses bind both optional callback slots and all three guarded
      deliveries, all nine synchronous resident consumers, the six-target
      main-shell dispatch after the boot returns, the full level-A reset/scene-load owner
      through 0x8005BC64 and its 20 post-FMV calls, and four exceptional-function
      categories. A current same-anchor movie-end batch now proves that only
      Start-positive reaches the player common-exit
      StClearRing/callback_teardown sequence; its no-input control retains exact
      FMV.BIN at frame 541. A longer same-anchor batch proves only that no-input
      LEV1A reaches those same call sites at emulator frame 5305, 634 frames
      after Start, and returns from callback_teardown without the Start trace's
      synthetic-unwind observer event. A new instruction-attributed control now
      identifies the cause for this run: after limit 386 is selected and
      backloc reaches 384 then 385, 0x800B6B48 publishes completion request
      0 to 1 with no decoded-record stop-latch write while exact FMV.BIN remains
      resident. A distinct C16 game-over control now proves the resident caller
      at 0x800500D8 enters fmv_bin_load with selector 46/mode 0, selects the
      281-frame LOSE stream, publishes completion, reaches the same balanced
      StClearRing/callback_teardown exit and returns to 0x800500E0. The invalid
      frame-zero precise-observer positive is retained as desync provenance;
      the behavioral positive uses a cycle-neutral cached prelude before exact
      stops. The earlier full-level exclusion is superseded: its frame-zero
      precise observers made the movie non-reproducible. A corrected passive
      recorded-anchor replay proves the 15,230-frame LEVEL01 input prefix
      covers both the level-A handoff 0x8005B788 and completed-level-B caller
      0x8005031C, while an all-neutral derivative covers neither. Each branch
      matches its own uninstrumented RAM/register/cycle/frame control. The
      save-anchor native/neutral branches still end in scenes 0/1 with zero
      completed-level caller and FMV function events. A bounded follow-up
      localizes the exact first caller to movie frame 14382: pre-delay
      a0/a1 are zero with progress ID one, and the post-delay loader boundary
      receives selector 11/mode -1. It publishes limit 485, completion one
      through frame-order-regression writer 0x800B6B24, then reaches
      StClearRing and balanced callback teardown at frame 15816. The
      same-window all-neutral branch excludes that exact Level-B route while
      retaining two different generic frontend loader calls. This reduces the
      named lifecycle residual but does not close other Level-B IDs,
      alternate/advert/viewer playback, pause/repeat or failure behavior.
      The centrally pinned 33,268-frame LEVEL15 lead is now rejected: bare
      0x80050284 coverage is contaminated by 326 cold-boot address-reuse hits,
      while exact a0=40 owner coverage and the disjoint 0x8005036C caller both
      remain zero through the complete recorded prefix. This is a fixture
      classification and observer guard, not finale lifecycle evidence.
      Static teardown ownership
      proves a conventional balanced
      guest return, both callback backends, every direct ready-slot xref, the
      default data SDK boundary, and the two CD-ROM MMIO target stores. The
      previously captured four words are the immutable MMIO pointer table, not
      callback storage. That teardown sub-boundary is complete, but original
      interfaces remain partial until the level/viewer transition writers and
      E12/C17/E14/E16 contracts are bound. The retained one-word CD-event
      consumer control now reaches CdControl(0x0B), StClearRing and callback
      teardown in order while its same-anchor native branch records none of
      those target events. This closes only the bounded player-consumer
      interface; native event delivery and visible Pause/failure policies are
      still unproved. Fresh pristine reconstruction exhausts all four resident
      direct DeliverEvent callers without finding the registered FMV
      class/spec producer, and separately binds both file-helper failure
      returns, the player diagnostic/shared-init join, decode-timeout fallback
      and GetlocP/Read2 retry branches. The executed same-target file-open
      branch control falsified its diagnostic prediction. Its four-byte
      endpoint label is now corrected: 0x800CAC08 is presentation RECT
      width/height, not the selected frame limit at 0x80131EEE. Static
      reconstruction now binds the exact cached-height pointer chain:
      0x800B6BF0 publishes the low halfword of 0x800B9A5C through boundary
      base 0x800CABE0 into presentation height 0x800CAC0A. Matching-C
      LoadImage and the pristine libgpu table resolve resident 0x80064178 to
      the downstream PsyQ _dws RECT clamp. All retained writer PCs are owned,
      and the unsaturated eleven-call successor is now statically partitioned:
      0x800B6C24 is a single-call wrapper, 0x800B70A0 owns the one
      initialization call, and 0x800B7280 owns ten calls from the outer player
      loop. Only a0 is live on entry to 0x800B6A7C; a1/a2/a3 are overwritten
      before use, so the retained 1/1/9 classes are caller-saved residue rather
      than record types or a fixed nine-iteration loop. The first synthetic
      exit remains observer provenance because both guest functions have
      conventional returns. This closes the helper/argument ownership
      sub-boundary but does not promote lifecycle.
      The natural LOSE return is now joined through
      scene_setup_and_load(5, 64) to selector-zero bits\memory.bin replacement
      at Region-B base 0x800B5788. C16 owns that game-over transition choice,
      while E16 resource dispatch owns the replacement bytes and the CdRead
      request. The natural completed-Level-B return is now independently
      joined through its state-one scene-flow owner: the negative request
      calls scene_setup_and_load(3, 0), while the nonnegative request calls
      scene_setup_and_load(6, 128). Both non-skip branches reach the same E16
      selector-zero bits\memory.bin request and Region-B destination. The
      completed-level owner publishes only scene-flow values zero or one,
      makes no Region-B materialization itself, does not call the save
      serializer and does not write the adjacent C17 movie-viewer unlock
      field. These close two caller-owned replacement sub-boundaries without
      claiming the first CD-ROM DMA write, movie-viewer breadth, or E14/C17
      persistence policy.
      Pristine resident bytes now close the selected replacement's exact
      submission subwindow: call 0x80046078 receives eighteen sectors and
      Region-B destination 0x800B5788, while pre-instruction stop 0x800460C4
      bounds exactly one CdRead submission. Around the rounded 36,864-byte
      read, CPU copies save and restore the 416-byte destination tail beyond
      the resource's 36,448-byte logical end. Every direct resident CdRead
      caller and predecessor edge is classified.
      The mutation-guarded exact-PC stop/arm adapter is now tracked and joined
      to the current debugger source, binary, RPC surface, pristine-media
      identity and the static 0x80046078-to-0x800460C4 boundary. Its retained
      synthetic transcript proves the command order, register checks, finite
      polling, complete pagination and single server-session labeling. This
      is method readiness, not a DMA observation or lifecycle promotion. The
      fresh exact-PC escalation is now generated as one passive and two
      precise receipt contracts. The passive 15800..15896 cold-boot window
      is strictly wider on both sides than the precise 15816..15880 window;
      both exact branches bind one paused frame-15816 scenario.runBatch
      anchor, a0=18/a1=0x800B5788, the two pre-instruction PCs, finite
      polling/pagination, the same centrally pinned LEVEL01 movie and current
      debugger/media identities. The later immutable iteration-before ledger
      admits that exact planned ID. Direct-command v2 receipt admission is
      now implemented and mutation-guarded: observer-plan schema v2 embeds
      the closed exact-PC plan, requires exactly one paused atomic anchor job,
      and replays every normalized direct command/result body through the
      tracked adapter under one owned server session. The legacy observer
      schema and historical atomic fixture remain valid, while changed
      command parameters/results, anchor counters and transfer pagination
      fail closed. This is receipt-method readiness, not a DMA observation or
      lifecycle promotion; this static work packet launched no emulator.
      No native failed-handle or visible-policy result is claimed. Runtime
      lifecycle/breadth and viewer/persistence policy remain separate
      dimension debt. The retained 0x80082250 field is now corrected from the
      historical fmv_running_latch capture alias to the shared frame-sync
      interrupt handshake. Ten compiler-standard direct xrefs and all five
      direct callers of helper 0x8003F2F0 are classified across interrupt,
      pad, transition, display, reset and scene-flow owners. The inline
      0x8004FEA4 wait is instruction-identical to the shared set-one,
      wait-while-one protocol, so the frame-15720 control position cannot
      bracket FMV retirement. This corrects a static ownership boundary and
      promotes no lifecycle dimension.
