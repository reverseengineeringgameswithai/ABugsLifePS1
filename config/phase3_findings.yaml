schema_version: 1
description: >
  Phase-3 findings registry, structured by the roadmap's "Definition of Finished
  for a reusable finding". A finding is NOT finished because it was demonstrated:
  it must be banked so a later agent (or mod) can locate, verify and consume it
  without repeating the investigation.

  Each entry declares, per the eight requirements:
    provenance   the hash-pinned fixtures + media the claim rests on
    machine      the authoritative machine representation (registry/schema/tool)
    evidence     the smallest reproducible experiment (artifact + exact command)
    guard        the executable falsifiable check (test id), or why none is possible
    canon        the Canon page a future reader will find first
    mod_contract how a mod may SAFELY consume it (owners, domains, reset rules,
                 and the known-unsafe assumptions) — "an address without its
                 ownership and lifecycle is not a safe extension point"
    confidence   confirmed | partial | inferred | disproven | blocked
    supersedes   claims this correction kills, so nobody revives them
    residuals    what is still unknown, and the next experiment

  tools/phase3_knowledge_audit.py CHECKS every one of these mechanically; it does
  not trust this file's prose.

findings:

  - id: scene_asset_load_graph
    title: Scene -> asset -> overlay routing (3 EXE tables) and the load law
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288 (disc sha1 0bc1a29748d4bd608d076495d085e825574880d1)
      fixtures: [REBUILD/files/SCUS_942.88]
      cross_evidence: analysis/phase2_completion_oracle.json
    machine: [analysis/phase3_scene_asset_graph.json, config/semantic_state.yaml]
    evidence: analysis/phase3_scene_asset_graph.json
    command: python3 tools/phase3_scene_asset_graph.py
    guard: tests/test_phase3_scene_graph.py
    canon: ObsidianVault/Canon/Systems/SYS_scene_asset_load_graph.md
    mod_contract: >
      Row index = scene_id - 1 in scene_asset_table 0x8001AD0C (15 x 0x10). The disc
      DIRECTORY selects the overlay pair, the ASSET PREFIX selects the sub-level data.
      UNSAFE ASSUMPTION TO AVOID: that disc dir number == scene id - it does NOT
      (scene 11 loads level02\level4b). A mod that rewrites a row must keep both
      halves consistent, and must not assume Training (scene 17) is in this table -
      it is loaded off-table.
    supersedes: []
    residuals: >
      Training is mapped as the resident/shared 0x8001AFB0[16] -> 0x8003CFC4
      exceptional route with pinned LEVEL00/GFX assets and unload ownership. LEVEL10
      has a single overlay where every other dir has a _LEVEL/_LEVEL1 pair - unexplained.

