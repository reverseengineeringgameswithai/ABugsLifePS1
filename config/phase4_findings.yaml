      - {artifact: analysis/phase4_thud_defeat.json, sha256: 74a2651cce32d860118adbc83f58ebaca7c1efa252ee205dbdce6ceece868338, json_path: action20_renderer_attribution.access.total, op: eq, expected: 118}
      - {artifact: analysis/phase4_thud_defeat.json, sha256: 74a2651cce32d860118adbc83f58ebaca7c1efa252ee205dbdce6ceece868338, json_path: action20_renderer_attribution.picked_packet.write_total, op: eq, expected: 16}
