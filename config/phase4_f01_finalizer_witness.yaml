  id: F01_request2_skips_finalizer
  observation_scope: 'Four declared leaves only: hit counts of 0x8004FF14 (consumer proceeded past its
    request!=0 && timer==0 guard) and 0x8004FF48 (finalizer call), plus the request word and [gp+0x4c4]
    captured pre-instruction at the 0x8004FF28 re-read. Both arms replay movies/Phase4/Interpreter/Any%
    Runs/LEVEL01_AntHill.movie.json from the same hash-bound anchor to movie frame 1950, then the positive
    arm writes u16 2 to 0x800823A0, then both resume to movie frame 2100. Narrow observation is deliberate:
    every observed difference is asserted, but unobserved state is not claimed.'
  statement: Setting the scene-transition request word 0x800823A0 to 2 while a completion transition is
    pending causes the consumer to skip the transition finalizer 0x80045A60, with the other skip condition
    [gp+0x4c4] measured at 0 in both arms.
