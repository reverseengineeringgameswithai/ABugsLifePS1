schema_version: 1
id: pristine_scene4_pit_status_denial
description: >-
  Replay the centrally pinned scene-4 pit lead from its inspected pristine
  state, clear only player status mask 0x0010 at the exact frame-204 boundary,
  and assert that the LEVEL04 fixed-tuple writer is denied while the resident
  transition handler consumes the previously retained safe tuple.
target:
  disc: ~/Downloads/ABL/Disney-Pixar A Bug's Life (v1.0).cue
  expected_serial: SCUS-94288
launch: {profile: generic}
playback:
  movie: movies/Phase4/E10/hazard_pit_LEVEL07.movie.json
  load_start_state: true
  require_reproducible: true
phases:
  - id: scene4_exact_pre_reset_status_gate
    trigger: {type: movie_frame, target: 204, max_frames: 230, timeout_seconds: 90}
    assertions:
      - {id: c15_s4_denial_pre_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 4}
      - {id: c15_s4_denial_pre_live_x, type: memory, address: 0x800A6500, width: s32, op: eq, expected: 749740}
      - {id: c15_s4_denial_pre_live_y, type: memory, address: 0x800A6504, width: s32, op: eq, expected: 121085}
      - {id: c15_s4_denial_pre_live_z, type: memory, address: 0x800A6508, width: s32, op: eq, expected: 124853}
      - {id: c15_s4_denial_pre_anchor_x, type: memory, address: 0x800A6550, width: s32, op: eq, expected: 744984}
      - {id: c15_s4_denial_pre_anchor_y, type: memory, address: 0x800A6554, width: s32, op: eq, expected: 4861}
      - {id: c15_s4_denial_pre_anchor_z, type: memory, address: 0x800A6558, width: s32, op: eq, expected: 139049}
      - {id: c15_s4_denial_pre_status, type: memory, address: 0x800A6590, width: u16, op: eq, expected: 20}
      - {id: c15_s4_denial_pre_health, type: memory, address: 0x800A6594, width: s16, op: eq, expected: 4}
      - {id: c15_s4_denial_pre_lives, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 6}
      - {id: c15_s4_denial_pre_movie_reproducible, type: rpc, method: movie.status, path: reproducible, op: eq, expected: true}
    after:
      - type: rpc
        id: clear_only_scene4_respawn_selector_status_bit
        method: debugger.writeU16
        params: {address: 0x800A6590, value: 4}
  - id: scene4_denied_writer_consumes_prior_anchor
    trigger: {type: movie_frame, target: 205, max_frames: 2, timeout_seconds: 60}
    assertions:
      - {id: c15_s4_denial_post_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 4}
      - {id: c15_s4_denial_post_live_x, type: memory, address: 0x800A6500, width: s32, op: eq, expected: 744984}
      - {id: c15_s4_denial_post_live_y, type: memory, address: 0x800A6504, width: s32, op: eq, expected: 4861}
      - {id: c15_s4_denial_post_live_z, type: memory, address: 0x800A6508, width: s32, op: eq, expected: 139049}
      - {id: c15_s4_denial_post_anchor_x, type: memory, address: 0x800A6550, width: s32, op: eq, expected: 744984}
      - {id: c15_s4_denial_post_anchor_y, type: memory, address: 0x800A6554, width: s32, op: eq, expected: 4861}
      - {id: c15_s4_denial_post_anchor_z, type: memory, address: 0x800A6558, width: s32, op: eq, expected: 139049}
      - {id: c15_s4_denial_post_heading, type: memory, address: 0x800A6578, width: s16, op: eq, expected: 1965}
      - {id: c15_s4_denial_post_health_restored, type: memory, address: 0x800A6594, width: s16, op: eq, expected: 4}
      - {id: c15_s4_denial_post_life_decremented, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 5}
      - {id: c15_s4_denial_post_movie_reproducible, type: rpc, method: movie.status, path: reproducible, op: eq, expected: true}
