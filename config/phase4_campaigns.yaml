schema: abl-phase4-campaigns/1
source_note: ObsidianVault/Playbooks/Game Solving Roadmap/Phase 4 - Solve Every Gameplay and Engine Subsystem.md
description: >
  Exhaustive Phase-4 family ownership for the authoritative Phase-1 mechanic
  registry. primary_rows have exactly one owner. dependency_rows may overlap,
  but never confer completion. Child campaigns and pristine-absence reviews are
  added only when evidence work actually begins; an empty list is an honest open
  gate, not an implied completion.

families:
  - id: input_player_actions
    number: 1
    title: Input and player actions
    priority_tier: 1
    scope: run, slow walk, turn, jump, kick, abdomen bounce, slide, spin, berry throw, swinging, and manual camera input
    primary_rows: [A01_move_run, A02_slow_walk, A03_jump, A04_kick,
                   A05_abdomen_bounce, A06_downhill_slide, A07_spin,
                   A08_berry_throw, A16_swinging, A17_camera_controls,
                   A20_circle_noop]
    dependency_rows: [A09_seed_pickup_drop, A10_handstand, A11_seed_as_weapon,
                      A12_seed_color_change, A13_cycle_plant_output,
                      A14_plant_seed, A15_uproot_plant, D03_contact_damage,
                      E02_collision, E04_camera_system, E05_actor_models_anim,
                      E12_audio]
    priority_basis: Core producer of player, physics, animation, combat, plant, camera, and audio state transitions.

  - id: player_lifecycle
    number: 2
    title: Player lifecycle
    priority_tier: 1
    scope: health, damage, invulnerability, shields, powers, death, checkpoints, lives, game over, and continue
    primary_rows: [C15_respawn_anchor, C16_lives_gameover]
    dependency_rows: [B06_invincibility, B07_health_power, B08_bubble_shield,
                      B09_super_jump, C12_health_leaves, D03_contact_damage,
                      E10_hazards, E13_hud_results, E14_frontend_save,
                      E16_streaming_overlays]
    priority_basis: Session-owned state crosses player actions, hazards, HUD, frontend persistence, death, reload, and scene transition.

  - id: movement_world_physics
    number: 3
    title: Movement and world physics
    priority_tier: 1
    scope: gravity, slopes, ledges, floors, walls, hazards, movers, air states, collision response, and camera collision
    primary_rows: [E02_collision]
    dependency_rows: [A01_move_run, A03_jump, A05_abdomen_bounce,
                      A06_downhill_slide, B01_mushroom_trampoline,
                      B02_propeller_plant, B03_dandelion_glide,
                      B04_cannon_plant, D02_mover_vm, E01_terrain_visual,
                      E04_camera_system, E08_props_movers_gates, E10_hazards,
                      E11_dynamic_geometry]
    priority_basis: Collision and integration are shared consumers of almost every actor, traversal power, mover, hazard, and camera path.

  - id: rendering_camera_animation
    number: 4
    title: Rendering, camera, and animation
    priority_tier: 1
    scope: world and actor submission, ordering tables, double buffering, materials, effects, models, animation, and normal or special cameras
    primary_rows: [E01_terrain_visual, E03_render_pipeline,
                   E04_camera_system, E05_actor_models_anim]
    dependency_rows: [A01_move_run, A03_jump, A04_kick,
                      A05_abdomen_bounce, A08_berry_throw, A16_swinging,
                      C01_grain_pickup, D01_enemy_spawn_update, E02_collision,
                      E06_contact_object_pool, E07_event_vm, E12_audio,
                      E16_streaming_overlays]
    priority_basis: Shared presentation substrate for every world, actor, effect, HUD-adjacent, and scene-residency conclusion.

  - id: seeds_plants_traversal_powers
    number: 5
    title: Seeds, plants, and traversal powers
    priority_tier: 2
    scope: every color and tier, carry, mount, plant, uproot, mushroom, propeller, dandelion, cannon, leaf platforms, temporary powers, shooters, mines, and combinations
    primary_rows: [A09_seed_pickup_drop, A10_handstand, A12_seed_color_change,
                   A13_cycle_plant_output, A14_plant_seed, A15_uproot_plant,
                   B01_mushroom_trampoline, B02_propeller_plant,
                   B03_dandelion_glide, B04_cannon_plant,
                   B05_green_leaf_platforms, B06_invincibility,
                   B07_health_power, B08_bubble_shield, B09_super_jump,
                   B10_purple_berry_plants, B11_blue_berry_shooter,
                   B12_homing_shooter, B13_mine_plant,
                   B14_hostile_plant_projectiles]
    dependency_rows: [A03_jump, A08_berry_throw, A11_seed_as_weapon,
                      C11_seed_tokens, D04_berry_immunity_matrix,
                      E02_collision, E06_contact_object_pool, E07_event_vm,
                      E12_audio]
    priority_basis: Depends on core action, physics, object, render, and audio substrates; high unresolved and variant breadth follows those shared campaigns.

  - id: collectibles_equipment_rewards
    number: 6
    title: Collectibles, equipment, and rewards
    priority_tier: 2
    scope: grain, FLIK letters, health leaves, berries, seed tokens, telescope, grain harvester, success tokens, medals, unlocks, and bonus entries
    primary_rows: [C01_grain_pickup, C02_fifty_grain_reward, C03_flik_letters,
                   C04_enemy_token, C05_three_tokens, C06_red_berry,
                   C07_blue_berry, C08_green_homing_berry,
                   C09_mega_homing_berry, C10_gold_berry, C11_seed_tokens,
                   C12_health_leaves, C13_grain_harvester, C14_telescope]
    dependency_rows: [A08_berry_throw, C15_respawn_anchor, C16_lives_gameover,
                      C18_bonus_entry, D05_death_respawn,
                      E06_contact_object_pool, E12_audio, E13_hud_results,
                      E14_frontend_save, E16_streaming_overlays]
    priority_basis: Reward state consumes object, combat, audio, HUD, persistence, and transition contracts and needs stage-wide pickup breadth.

  - id: objects_events_hazards
    number: 7
    title: Objects, events, and hazards
    priority_tier: 1
    scope: contacts, pickups, props, gates, switches, movers, dynamic geometry, scripted actors, event VM, objectives, and environmental hazards
    primary_rows: [E06_contact_object_pool, E07_event_vm,
                   E08_props_movers_gates, E09_grain_gates, E10_hazards,
                   E11_dynamic_geometry]
    dependency_rows: [D02_mover_vm, E01_terrain_visual, E02_collision,
                      E03_render_pipeline, E04_camera_system,
                      E05_actor_models_anim, E12_audio,
                      E16_streaming_overlays]
    priority_basis: Shared allocation, dispatch, scripted-event, and hazard substrate used by collectibles, enemies, bosses, and stage objectives.

  - id: enemies_combat
    number: 8
    title: Enemies and combat
    priority_tier: 2
    scope: every regular family and variant, AI, attacks, immunities, damage, death, drops, respawn, permanent kills, and quotas
    primary_rows: [A11_seed_as_weapon, D01_enemy_spawn_update, D02_mover_vm,
                   D03_contact_damage, D04_berry_immunity_matrix,
                   D05_death_respawn, D06_grasshoppers, D07_mosquitoes,
                   D08_flies, D09_cockroaches, D10_spiders,
                   D11_mites_grubs, D12_centipedes_earthworms,
