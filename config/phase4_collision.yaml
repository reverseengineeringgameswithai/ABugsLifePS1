schema: abl-phase4-collision/1
row: E02_collision
owner: movement_world_physics
coordinate_system:
  axes: [x, y, z]
  up_direction: negative_y
  plane_local_to_world_scale: 32
runtime_sector_table:
  base: 0x800A7E48
  count_address: 0x800822A0
  stride: 0x30
  grid_scan_limit: 700
  fields:
    origin: {offsets: [0x00, 0x04, 0x08], type: s32, scale: world_units}
    block_pointer: {offset: 0x10, type: u32}
    aabb_min_x: {offset: 0x14, type: s32}
    aabb_min_z: {offset: 0x1C, type: s32}
    aabb_extent_x: {offset: 0x24, type: s32}
    aabb_extent_z: {offset: 0x28, type: s32}
    flag: {offset: 0x2C, type: u16}
    region_code: {offset: 0x2E, type: s16, observed_domain: [0, 1, 2, 3, 4]}
plane_record:
  size: 0x20
  fields:
    normal: {offsets: [0x00, 0x02, 0x04], type: s16}
    reference_point: {offsets: [0x06, 0x08, 0x0A], type: s16, scale: 32}
    face_deltas: {offsets: [0x0C, 0x0E, 0x10, 0x12, 0x14, 0x16], type: s16}
    footprint_x: {offsets: [0x18, 0x1A], type: s16}
    unread_1c: {offset: 0x1C, type: s16}
    footprint_z_packed: {offsets: [0x1E, 0x1F], type: s8}
  floor_or_slope_predicate: normal_y < 0
  response: swept front-to-back plane crossing followed by point-in-face validation and resolved XYZ commit
player_candidate_list:
  count_address: 0x80082314
  pointer_base: 0x8009C230
  pointer_type: u32
  owning_sector_base: 0x80091718
  owning_sector_type: u16
  adjacent_storage_end: 0x8009C870
  pointer_storage_slots: 400
  append_writer: 0x800368E8
  append_has_bounds_check: false
  reset: count is cleared for each entity/integrator use and the arrays are overwritten
  failure_policy: >-
    Treat 400 as a hard emitter/validator ceiling, not a safe gameplay target.
    The retail append writer has no bounds check, so malformed geometry that can
    publish 400 or more simultaneous candidates must be rejected before build.
region_query:
  function: 0x80038F38
  current_player_sector: 0x80090560
  player_gate: 0x800A6582
  gate_value: 1
  output: signed region_code from current sector +0x2E
  level01_exit: {sector: 177, region_code: 2, transition_lever: 0x800823A0}
assets:
  source: centrally pinned REBUILD/files/LEVEL*/LEVEL*.RAW
  collision_chunk_marker: 0x0103
  collision_tail_marker: 0x0104
  compression: tools/decode_level_raw.py and tools/recompress_level_raw.py
  rule: verify pristine input, decode, edit one fresh copy, and semantic-round-trip before any build
ownership_boundaries:
  owned: sector conversion, grid/AABB selection, player candidate construction, swept plane response, floor/ground state, and region-code query
  not_owned:
    terrain_rendering: E01_terrain_visual
    camera_boom_collision: E04_camera_system
    mover_behavior: E08_props_movers_gates
    hazard_damage_and_death: E10_hazards and player_lifecycle
    scene_transition_dispatch: loading_overlays_resources
mod_contract:
  owner: resident collision converter/grid plus player movement-collision integrator
  readers: sector/grid candidate builders, swept resolver passes, player/camera/mover consumers, region query
  writers: level-load converter/grid builders, per-use candidate append/reset, resolved XYZ commits, current-sector publication
  valid_domains: sector count 1..700; candidate count 0..399; valid RAM plane pointers; s16 plane fields; observed region codes 0..4
  initialization: verified LEVEL.RAW chunks are decompressed and converted during scene load before gameplay consumes them
  reset: candidate count/list is per-use scratch; pause freezes player/floor outputs; scene load rebuilds the sector table
  retirement: scene unload retires the old world table/plane heap; the next scene overwrites the resident table and scratch lists
  consumers: player physics, movers, camera collision callers, ground-height/spawn queries, checkpoints, and region/exit dispatch
  capacity: grid scans at most 700 sectors; pointer storage has 400 slots and the retail append writer has no bounds check
  residency: code and table addresses are resident; plane/block payloads and table contents are scene-local
  unsafe_assumptions: >-
    Do not infer visual terrain is tangible, assume an unbounded candidate list,
    reuse table or plane pointers across loads, treat region codes as generic
    hazards, or use ALLMODS/non-pristine media as original-game authority.
