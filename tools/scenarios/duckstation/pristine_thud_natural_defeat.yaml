schema_version: 1
id: pristine_thud_natural_defeat
description: >-
  Replay the centrally pinned pristine-serial Thud recording and assert the
  recorded player-projectile allocation, natural action-2/class-0 contact
  decrement, overlay-target restoration, one Thud-owned action-20 contact-
  object launch and natural miss/retirement, eight counter-linked cycles,
  one rolling-boulder overlap, counter-8 actor path, HP-zero, persistent
  retirement, and scene exit without claiming berry color, boss attack policy,
  complete rolling-arena geometry, or arena completion.
target:
  disc: ~/Downloads/ABL/Disney-Pixar A Bug's Life (v1.0).cue
  expected_serial: SCUS-94288
launch: {profile: generic}
playback:
  movie: thud_boss_movie.movie.json
  load_start_state: true
  require_reproducible: true
phases:
  - id: thud_player_projectile_pre_launch
    trigger: {type: movie_frame, target: 895, max_frames: 910, timeout_seconds: 180}
    assertions:
      - {id: thud_projectile_pre_windup, type: memory, address: 0x800A6586, width: u16, op: eq, expected: 6}
      - {id: thud_projectile_pre_in_flight, type: memory, address: 0x800A6596, width: u8, op: eq, expected: 2}
      - {id: thud_projectile_pre_slot_action, type: memory, address: 0x800B12E8, width: u8, op: eq, expected: 4}
  - id: thud_player_projectile_post_launch
    trigger: {type: movie_frame, target: 914, max_frames: 24, timeout_seconds: 60}
    assertions:
      - {id: thud_projectile_post_windup, type: memory, address: 0x800A6586, width: u16, op: eq, expected: 9}
      - {id: thud_projectile_post_in_flight, type: memory, address: 0x800A6596, width: u8, op: eq, expected: 3}
      - {id: thud_projectile_post_slot_action, type: memory, address: 0x800B12E8, width: u8, op: eq, expected: 2}
      - {id: thud_projectile_post_slot_ttl, type: memory, address: 0x800B12EA, width: u16, op: eq, expected: 99}
  - id: thud_contact_pre_damage
