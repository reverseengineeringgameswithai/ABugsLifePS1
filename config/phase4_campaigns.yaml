    dependency_rows: [C01_grain_pickup, C03_flik_letters, C04_enemy_token,
                      C05_three_tokens, D01_enemy_spawn_update,
                      D02_mover_vm, D03_contact_damage,
                      D04_berry_immunity_matrix, D05_death_respawn,
                      E01_terrain_visual, E02_collision, E03_render_pipeline,
                      E04_camera_system, E05_actor_models_anim,
                      E06_contact_object_pool, E07_event_vm,
                      E08_props_movers_gates, E09_grain_gates, E10_hazards,
                      E11_dynamic_geometry, E12_audio, E13_hud_results,
                      E15_fmv, E16_streaming_overlays]
    priority_basis: Special objectives compose the shared substrates and family-specific mechanics, so they follow rather than replace those campaigns.

  - id: hud_frontend_persistence
    number: 10
    title: HUD, frontend, and persistence
    priority_tier: 2
    scope: status, pause, results, menus, options, remapping, save and load, continue, game over, movie viewer, and unlock persistence
    primary_rows: [A18_pause, A19_status_display, C17_movie_viewer,
                   E13_hud_results, E14_frontend_save]
    dependency_rows: [C02_fifty_grain_reward, C03_flik_letters,
                      C04_enemy_token, C05_three_tokens, C11_seed_tokens,
                      C15_respawn_anchor, C16_lives_gameover, C18_bonus_entry,
                      E12_audio, E15_fmv, E16_streaming_overlays]
