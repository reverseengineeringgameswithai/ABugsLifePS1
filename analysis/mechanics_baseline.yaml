eir extent was CFG-unreachable (57 records / 10898 instructions), so their accesses were neither resolved nor listed as blockers. 2026-08-06 the index began consuming the jump tables tools/phase3_jr_tables.py had already recovered but nothing read (36 decoded sites, 408 distinct targets, import refused unless the artifact's pinned image sha256 matches). CFG coverage across all 21 images went 90.9% -> 96.4% (+6570 instructions across 30 functions); the RESIDENT-only split is 90.3% -> 97.1% and the overlays were unchanged, contributing no decoded jr sites but diluting the combined denominator -- the earlier 'resident CFG coverage' label was the corpus figure misnamed, index memory_accesses 30612 -> 32597, and the frontier's unanalysed_extents 57 -> 28. scene_flow_dispatcher is NOT among the recovered -- it has no decoded jr site and stays at 8 of 393, so this row's own lifecycle function remains the residual. Consequently 9 of the 62 resident window-reaching sites are absent from the static index entirely, and the escalation check (second_opinion.sites_reported_as_reaching_a_window) cannot see a site the index never emitted. Two fresh verifiers confirmed that check is NOT vacuous -- the same analysis finds 124 window-reaching sites corpus-wide, all of them already-known, and a large population of resident sites where it could have fired and did not (a specific figure previously quoted here could not be reproduced by the second verifier and has been withdrawn rather than restated). Mitigation: accessLog write watches on 0x800823A0 across two full armed routes observed only the statically enumerated writers -- a falsifier that did not fire, not a universal negative."
