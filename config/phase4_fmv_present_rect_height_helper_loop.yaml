claim_boundary:
  packet_claim: >
    The pristine 0x800B6C24 helper contains a finite loop whose static bound
    produces the retained 1, 1 and 9 argument-class counts.
  corrected_claim: >
    Pristine 0x800B6C24 calls 0x800B6A7C exactly once per invocation. The
    player calls the helper once at 0x800B70A0 before its outer loop and once
    at 0x800B7280 per outer-loop iteration. Only a0 is semantic at the commit
    entry; a1, a2 and a3 are overwritten before use, so the retained 1/1/9
    classes are incidental register snapshots. The trace therefore partitions
    as one initialization call plus ten outer-loop calls, while nine is only
    the count of the final incidental class in that bounded window.
  falsifier: >
    Reject the corrected claim if either function has another direct or
    indirect caller, 0x800B6C24 calls the commit function other than exactly
    once per invocation, the initialization call can be revisited by the
    player back edge, any of a1/a2/a3 is read before its asserted first
    definition, a0 is not the stable 0x800CABE0 boundary, the 1/1/9 runtime
    partition differs, either function lacks a conventional guest return, or a
    load-bearing opcode/artifact/schema mutation leaves the focused guard green.
