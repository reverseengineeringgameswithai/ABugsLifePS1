mod_contract:
  owner: Preserve parser, culler, actor initialization/update and scene lifecycle order; name every hook and table edit.
  readers: Enumerate pass-table, bitmap, visible-list, actor/source, collision, render, contact, event-VM, objective and persistence consumers before changing ownership.
  writers: Do not add unordered writes to table XYZ/extent/flags/source, nested payload pointers, bitmap bits, actor fields, callbacks or scene-owned source records.
  valid_domains: Preserve stride 0x14, signed sentinel semantics, pointer class, fixed 64-record actor capacity and per-DAT row bounds; reject arithmetic overflow and unverified external-relative pointers.
  initialization: Verify all pristine inputs and complete relocation before any pass-table, actor or MOD-private consumer runs.
  reset: Freeze on pause and rebuild or clear private state on death, checkpoint reload, save load and every scene transition.
  retirement: Retire actor, source, callback, gate/mover and overlay references once before their owning scene or image unloads.
  consumers: Rendering, collision, contacts, event VM, movers, switches, gates, objectives, pause, persistence, stages and bonuses.
  capacity: Preserve 64 actor records; declare row, bitmap, authored-state, hook and cave bounds for every MOD extension.
  residency: Parser/culler/updater code and fixed buffers are resident; DAT tables, actor sources and authored interaction state are scene-owned unless separately proven.
  unsafe_assumptions: >-
    A pass-3 anchor is not a draw position; a visual prop does not imply its
    collision; an out-of-file relative pointer is not automatically corrupt;
    actor slots are not cross-scene identity; static catalog membership does
    not prove contact, switch, gate, mover or persistence policy.
