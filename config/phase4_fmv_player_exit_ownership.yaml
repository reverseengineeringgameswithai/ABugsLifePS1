claim_boundary:
  claim: >
    In pristine FMV.BIN, every post-helper continuation is owned by one of
    five exact predicates: the u8 decode-stop latch, resident CD-event value
    one, a controller-derived 12-step skip sentinel, completion request value
    one, or decoded-frame-index less than the signed selected limit. The
    completion-request branch alone issues CdlStop command 8 before joining
    the shared CdlPause command 11 and common teardown. The controller path
    polls resident input state, masks 0x4008, seeds the countdown at one, and
    exits only when it reaches twelve. CdlPause here is stream teardown, not
    the frontend pause-shell action.
  falsifier: >
    Reject the claim if the retained index already answers an exact requested
    term, another encoded edge enters 0x800B6E38, 0x800B7464 or 0x800B7468,
    a producer load or comparison is missing, the controller mask/countdown
    differs from 0x4008 and twelve, completion does not issue command 8 before
    command 11, a runtime outcome is inferred from static routing, or a
    load-bearing pristine byte/artifact/source mutation leaves the focused
    guard green.
  dimension_promoted: false
  lifecycle_promoted: false
  closed_sub_boundary: post_helper_exit_and_cd_command_ownership
  next_lane: static
  next_method: >
    Preserve this complete in-player exit partition. Next, statically identify
    the first caller-owned Region-B overwrite after one selected level/viewer
    return and classify its E16/E14 owner before considering another live
    control.
  not_claimed:
    - native delivery frequency for the resident CD event
    - native malformed-stream or timeout outcomes
    - a user-visible pause menu caused by CdlPause command 11
    - behavior of every manifest selector or movie-viewer path
    - the first caller-owned Region-B replacement instruction
    - lifecycle or any other nine-dimension promotion
