    dependency_rows: [A04_kick, A05_abdomen_bounce, A08_berry_throw,
                      C04_enemy_token, C06_red_berry, C07_blue_berry,
                      C08_green_homing_berry, C09_mega_homing_berry,
                      C10_gold_berry, C12_health_leaves, E02_collision,
                      E03_render_pipeline, E05_actor_models_anim,
                      E06_contact_object_pool, E07_event_vm, E12_audio,
                      E13_hud_results]
