schema_version: 1
id: pristine_c15_authored_row_denial
description: >-
  Replay the centrally pinned LEVEL02 pit lead from its inspected pristine state,
  clear only player status mask 0x0010 at the exact frame-156 boundary, and
  assert that the LEVEL03 row selector is denied while the resident transition
  handler consumes the previously retained safe anchor.
target:
  disc: ~/Downloads/ABL/Disney-Pixar A Bug's Life (v1.0).cue
  expected_serial: SCUS-94288
launch: {profile: generic}
playback:
  movie: movies/Phase4/E10/hazard_pit_LEVEL02.movie.json
  load_start_state: true
  require_reproducible: true
phases:
  - id: exact_pre_reset_selector_gate
    trigger: {type: movie_frame, target: 156, max_frames: 180, timeout_seconds: 60}
    assertions:
      - {id: c15_denial_pre_live_x, type: memory, address: 0x800A6500, width: s32, op: eq, expected: 508193}
      - {id: c15_denial_pre_live_y, type: memory, address: 0x800A6504, width: s32, op: eq, expected: 153067}
      - {id: c15_denial_pre_live_z, type: memory, address: 0x800A6508, width: s32, op: eq, expected: 517418}
      - {id: c15_denial_pre_anchor_x, type: memory, address: 0x800A6550, width: s32, op: eq, expected: 507900}
      - {id: c15_denial_pre_anchor_y, type: memory, address: 0x800A6554, width: s32, op: eq, expected: 31787}
      - {id: c15_denial_pre_anchor_z, type: memory, address: 0x800A6558, width: s32, op: eq, expected: 503976}
      - {id: c15_denial_pre_status_word, type: memory, address: 0x800A6590, width: u16, op: eq, expected: 20}
      - {id: c15_denial_pre_health, type: memory, address: 0x800A6594, width: s16, op: eq, expected: 3}
      - {id: c15_denial_pre_lives, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 5}
      - {id: c15_denial_pre_movie_reproducible, type: rpc, method: movie.status, path: reproducible, op: eq, expected: true}
    after:
      - type: rpc
        id: clear_only_respawn_selector_status_bit
        method: debugger.writeU16
        params: {address: 0x800A6590, value: 4}
  - id: denied_selector_consumes_prior_anchor
    trigger: {type: movie_frame, target: 157, max_frames: 2, timeout_seconds: 60}
    assertions:
      - {id: c15_denial_post_live_x, type: memory, address: 0x800A6500, width: s32, op: eq, expected: 507900}
      - {id: c15_denial_post_live_y, type: memory, address: 0x800A6504, width: s32, op: eq, expected: 31787}
      - {id: c15_denial_post_live_z, type: memory, address: 0x800A6508, width: s32, op: eq, expected: 503976}
      - {id: c15_denial_post_anchor_x, type: memory, address: 0x800A6550, width: s32, op: eq, expected: 507900}
      - {id: c15_denial_post_anchor_y, type: memory, address: 0x800A6554, width: s32, op: eq, expected: 31787}
      - {id: c15_denial_post_anchor_z, type: memory, address: 0x800A6558, width: s32, op: eq, expected: 503976}
      - {id: c15_denial_post_health_restored, type: memory, address: 0x800A6594, width: s16, op: eq, expected: 4}
      - {id: c15_denial_post_life_decremented, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 4}
      - {id: c15_denial_post_movie_reproducible, type: rpc, method: movie.status, path: reproducible, op: eq, expected: true}
