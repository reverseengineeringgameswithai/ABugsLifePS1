schema: abl-phase4-offline-plant-weapon-batch-source/1
description: >
  Declarative selection and evidence contract for the three highest-ranked open
  yellow-plant weapon rows. The reconstructed per-frame index remains external
  game-derived evidence; Git retains hashes, bounded summaries, the generator,
  and falsifiable guards.
selected_rows:
  - B11_blue_berry_shooter
  - B12_homing_shooter
  - B13_mine_plant
expected_unique_capsules: 4
selection_snapshot:
  queue_counts:
    rows: 107
    complete: 16
    open: 91
    offline_ready: 12
    offline_partial: 21
    live_required: 6
    no_capsule: 68
  rows:
    - {row_id: B11_blue_berry_shooter, queue_rank: 1, classification: offline_ready, completion_state: open}
    - {row_id: B12_homing_shooter, queue_rank: 2, classification: offline_ready, completion_state: open}
    - {row_id: B13_mine_plant, queue_rank: 3, classification: offline_ready, completion_state: open}
external_index:
  schema: abl-phase4-external-plant-weapon-index/1
  domains: [registers, ram, vram, spu_ram, block_flow]
tracked_summary:
  schema: abl-phase4-offline-plant-weapon-batch/1
  excludes: [raw_ram, raw_vram, raw_spu_ram, capsule_chunks, movie_bytes, save_bytes]
  causality_boundary: >
    Frame-boundary state changes, range intersections, and hotspots do not
    identify an exact CPU writer, collision callback, target selector,
    projectile owner, GPU/SPU producer, or causal behavioral control.
