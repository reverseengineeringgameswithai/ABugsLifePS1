schema_version: 1
id: pristine_scene8_level08_respawn_initializer
description: >-
  Load the centrally pinned pristine Riverbed Flight anchor, reproduce the
  natural actor-contact death and ordinary respawn while asserting the loaded
  resident scene-8 call word and residency-matched LEVEL08 initializer word.
  Cycle-neutral execution coverage in the companion live artifact establishes
  activation; this scenario assigns neither an actor species nor a universal
  checkpoint policy.
target:
  disc: Disney-Pixar A Bug's Life (v1.0).cue
  expected_serial: SCUS-94288
  media_class: pristine
launch: {profile: generic}
anchor:
  type: save_state
  path: level_14.sav
  sha256: 6e56d8c4780851f85059b477186b5b1346e23ed7e8eac79a134192e03fef5f50
setup:
  - {type: rpc, id: select_fatal_health, method: debugger.writeU16, params: {address: 0x800A6594, value: 0}}
  - {type: rpc, id: select_ordinary_respawn_lives, method: debugger.writeU8, params: {address: 0x800A65A0, value: 3}}
  - {type: rpc, id: place_live_x, method: debugger.writeU32, params: {address: 0x800A6500, value: 0xFFFDDD06}}
  - {type: rpc, id: place_live_y, method: debugger.writeU32, params: {address: 0x800A6504, value: 0xFFFFE710}}
  - {type: rpc, id: place_live_z, method: debugger.writeU32, params: {address: 0x800A6508, value: 0x0004E226}}
  - {type: rpc, id: place_previous_x, method: debugger.writeU32, params: {address: 0x800A6510, value: 0xFFFDDD06}}
  - {type: rpc, id: place_previous_y, method: debugger.writeU32, params: {address: 0x800A6514, value: 0xFFFFE710}}
  - {type: rpc, id: place_previous_z, method: debugger.writeU32, params: {address: 0x800A6518, value: 0x0004E226}}
phases:
  - id: scene8_natural_contact_boundary
    trigger: {type: emulator_frame, target: 223793, max_frames: 70, timeout_seconds: 120}
    assertions:
      - {id: c15_scene8_boundary_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 8}
      - {id: c15_scene8_boundary_health, type: memory, address: 0x800A6594, width: s16, op: eq, expected: 0}
      - {id: c15_scene8_boundary_lives, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 3}
      - {id: c15_scene8_boundary_master_state, type: memory, address: 0x800823A0, width: u16, op: eq, expected: 0}
      - {id: c15_scene8_actor_flags, type: memory, address: 0x800A0070, width: u16, op: eq, expected: 0x4011}
      - {id: c15_scene8_resident_call_word, type: memory, address: 0x8005B1A4, width: u32, op: eq, expected: 0x0C02CEBA}
      - {id: c15_level08_initializer_first_word, type: memory, address: 0x800B3AE8, width: u32, op: eq, expected: 0x27BDFFE8}
  - id: scene8_natural_fatal_boundary
    trigger: {type: emulator_frame, target: 223853, max_frames: 70, timeout_seconds: 120}
    assertions:
      - {id: c15_scene8_fatal_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 8}
      - {id: c15_scene8_fatal_health, type: memory, address: 0x800A6594, width: s16, op: eq, expected: -1}
      - {id: c15_scene8_fatal_lives_not_yet_decremented, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 3}
      - {id: c15_scene8_fatal_master_state, type: memory, address: 0x800823A0, width: u16, op: eq, expected: 2}
  - id: scene8_level08_initializer_and_ordinary_respawn
    trigger: {type: emulator_frame, target: 223973, max_frames: 130, timeout_seconds: 120}
    assertions:
      - {id: c15_scene8_respawn_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 8}
      - {id: c15_scene8_respawn_health_restored, type: memory, address: 0x800A6594, width: s16, op: eq, expected: 4}
      - {id: c15_scene8_respawn_lives_decremented, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 2}
      - {id: c15_scene8_respawn_master_state_clear, type: memory, address: 0x800823A0, width: u16, op: eq, expected: 0}
      - {id: c15_scene8_respawn_live_x, type: memory, address: 0x800A6500, width: s32, op: eq, expected: -151234}
      - {id: c15_scene8_respawn_live_y, type: memory, address: 0x800A6504, width: s32, op: eq, expected: 3440}
      - {id: c15_scene8_respawn_live_z, type: memory, address: 0x800A6508, width: s32, op: eq, expected: -2074}
