mation -- 0x800A6597 is the 64x5 SIDE-TABLE index used four instructions later at 0x800590F0, not the berry type. The 0x800B441C counter gates the LAUNCH-HIGH, not the restore: 0x800B3E50 reads it and while <5 writes 0xFFFDCFF0 into the bird's anchor Y (+0x2C) and target Y (+0x38) and clears flag bit 0x02 -- the row's 'gold berry launches the bird higher', now pinned as CAPPED AT FIVE launches (measured 0->5 while nine restores occurred, exactly as the delay-slot store implies). FULL DAMAGE TABLE 2026-08-04: the berry type is a BYTE at projectile+0x2C, from a fixed resident pool (base 0x800B0D18, entries from +8 = 0x800B0D20, stride 0x38). Table: type 0 -> -2, 1 -> hp-99, 12 -> -2, 127 -> -4, 128 -> -3, default -1. ⚡ AND THE GATE AT 0x80059068 (`slti v0,v0,100`) EXPLAINS THIS ROW'S OWN UNEXPLAINED CLIFFSIDE OBSERVATION: the row records id=30 appearing at Cliffside with hp 101 instead of 50 and 'never damaged' -- that is not tuning, it is 101 >= 100, so it never reaches the damage table at all. Giving the Cliffside bird 101 HP is how it was made invulnerable. ✅ CLOSED LIVE 2026-08-04 by register capture at a breakpoint on PHYSICAL 0x000590E4 (hit_count 19): berry type 128 -> -3 (NINE hits, each producing new_hp 47 and restored to 50 by the gate, because the gate requires damage==3) and berry type 127 -> -4 (EIGHT hits, walking 46->42->38->34->30->26->22->18 to the defeat threshold); type 0 -> -2 was also observed on two other actors. The switch from 128 to 127 at movie frame 4817 is exactly where the restores stop. NOT established: which NAMED berry each type is -- the operator narrative mentions a gold berry mid-fight, but the type->name binding is a separate table and was not measured. ⚠️⚠️ RETRACTION, SAME DAY: an earlier binding here claimed EXECUTE BREAKPOINTS NEVER FIRE and that CLAUDE.md was wrong. That was MY error. Breakpoints work; the address must be PHYSICAL (addr & 0x1FFFFFFF). Measured side by side on a PC executing 2,079 times: virtual 0x8004c834 + debugger.resume -> hit_count 0; virtual + movie.advanceToFrame -> 0; physical 0x0004c834 + debugger.resume -> 1, halts correctly. The regime is irrelevant; the address form is the whole story -- and it is the SAME rule this project already documents for transferLog.resolve, which was in the trace-gotchas memory the whole time. What survives: the failure is SILENT (call succeeds, breakpoint reports enabled, capture returns empty), so assert hit_count > 0 before trusting any breakpoint result; and a SPARSE breakpoint needs a long wait -- this one first fires ~3,900 frames (~65s) into playback, so a 20s inner wait times out and looks identical to a dead breakpoint."
