# G. Lifecycle dimensions — every row above must eventually be exercised across
# these axes (kept as axes, not rows; Phase 2 builds the oracle matrix from them).
dimensions:
  - cold boot / load / first use / repeated use / exhaustion / retirement / reuse
  - pause-status / damage / death / respawn-anchor restore / life loss / game over / continue
  - level exit / objective completion / results / save / reload / scene+overlay transition
  - camera modes / animation states / render double buffering / audio start-stop / effects
  - native combinations (carry+damage, powers+jump, projectiles at transitions, enemies vs hazards/plants)
  - campaign breadth (normal / traversal-special / boss / chase / city / interior / exterior / bonus)
