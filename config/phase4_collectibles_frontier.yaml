exact_claim: >-
  The pristine resident image assigns actor ID 35 and the CHARS3/FLIKHARV
  asset to the grain harvester, sets player power-up bit 0x80 at the equipment
  pickup, follows Flik from fixed actor slot 63, and lets bit 0x80 make kind
  0x14 source rows construct ctor 0x51/action-20 grain contacts inside squared
  distance 0x15F8F. Those contacts use the common 0x8005A308 convergence law
  before the existing action-20 grain handler. At exactly 50 grain, the
  resident code reaches health=4 but its fixed-address comparison makes the
  progress/life increment branch unreachable.
falsifier: >-
  Reject the frontier if any pinned fixture/input hash drifts; actor ID 35
  does not resolve through jump-table case 0x8005E17C to chars3\flikharv;
  the C13 capsule does not uniquely join the stage01 authored slot-63 actor,
  bit 0x80 and the observed (0,192,0) follow delta; ctor 0x51 metadata differs;
  any guarded source/convergence/reward instruction differs; or the presumed
  grain-50 progress branch compares equal resident addresses.

