  - id: bosses_special_objectives
    number: 9
    title: Bosses and special objectives
    priority_tier: 3
    scope: Thumper, Bird, Thud, Molt, Hopper, flight and chase, rolling arena, bird assembly, companion rescue, finale mechanics, Training, campaign stages, and bonus objectives
    primary_rows: [C18_bonus_entry, D16_thumper, D17_bird, D18_thud,
                   D19_molt, D20_hopper, F00_training, F01_anthill,
                   F02_tunnels, F03_council_chamber, F04_cliffside_canyon,
                   F05_riverbed_run, F06_birdnest, F07_city_entrance,
                   F08_city_square, F09_bug_bar, F10_clover_forest,
