record:
  size: 0x38
  fields:
    position: {offsets: [0x00, 0x04, 0x08], type: s32}
    render_or_motion_words: {offsets: [0x0C, 0x10, 0x14, 0x18], type: s32}
    sentinel: {offset: 0x1C, type: s32, initial: -1}
    action_id: {offset: 0x20, type: u16}
    lifetime_ttl_or_active_gate: {offset: 0x22, type: u16}
    variant: {offset: 0x24, type: s16}
    secondary_counter: {offset: 0x26, type: u16}
    radius_add: {offset: 0x28, type: s16}
    state: {offset: 0x2C, type: s16}
    orientation: {offset: 0x2E, type: s8}
    flags: {offset: 0x33, type: u8}
    post_init_state: {offset: 0x37, type: u8}
  field_0x22_ownership: >-
    Type-specific. Native berry projectile updaters decrement it as a TTL to
    zero. A directly allocated ctor-0x51 contact-proximity record remains at
    200 while merely elapsed/far and the walker changes it to 1 on contact.
    Code that shares the pool must not impose one universal update law.
  residue_rule: Occupancy is defined only by the retail predicates; nonzero dead bytes are not ownership.

capacity_and_arithmetic_guards:
  pristine_observed_allocator_occupancy: {min: 0, max: 4, headroom_min: 60, anchors: 19}
  mod_emitter_limit: Never make all 64 records allocator-occupied.
  contact_distance_math: signed fixed-point deltas and signed 32-bit squares
  invalid_coordinate_failure: >-
    A synthetic +0x100000 delta on each axis overflowed the signed square sum
    and falsely selected the contact action. Validate coordinate domains; do
    not assume increasing distance is monotonic outside retail-authored bounds.

ownership_boundaries:
  owned: >-
    Type-0x3f authored-source census and source dispatch handoff, contact pool
    allocation, metadata construction, walker gate/action dispatch, capacity,
    reuse, pause, retirement and scene/death lifecycle.
  not_owned:
    collectible_rewards: C01 through C14
    projectile_input_and_aim: A08
    enemy_damage_and_drops: D-family rows
    descriptor_asset_decoding: E05
    rendering_submission: E03
    audio_outcomes: E12
    persistence_and_results: E13 and E14
    stage_objectives: F rows

mod_contract:
  owner: Preserve resident type-0x3f, allocator, walker, projectile, render-handoff and lifecycle order; name every hook.
  readers: Enumerate source records, descriptor pointers, metadata tables, pool/cursor, walker/projectile, rendering, damage, rewards, audio, HUD, pause, respawn and scene consumers.
  writers: Do not add unordered writes to source entry status/coordinates, descriptor pointers, cursor, record position/action/field-0x22/state/flags, or lifecycle clears.
  valid_domains: Source kind is u8; source dispatch is 0x10..0x31; pool index is 0..63; metadata B retained domain is 0..128; coordinates must remain inside proven non-overflow bounds.
  initialization: Verify pristine assets, initialize source/descriptor tables before use, and initialize MOD-private state before its first reader.
  reset: Clear private ownership on contact/TTL retirement, pause-shell reset, death/respawn/reload, takeover and every scene transition.
  retirement: Release every pool unit exactly once and retire source, descriptor and overlay-scoped references before their owners unload.
  consumers: Collectibles, berries, plants, enemies, effects, rendering, camera, audio, HUD, persistence, stages and bonuses.
  capacity: Never hold all 64 retail slots occupied; declare stricter per-emitter budgets and reject invalid metadata/source indices before allocation.
  residency: Allocator, walker, tables and pool addresses are resident; type-0x3f rows and descriptor targets are scene-owned and cannot survive unload.
  unsafe_assumptions: >-
    Fifty descriptor slots are not fifty authored kinds; field 0x22 is not one
    universal TTL law; cursor is not identity; residue is not occupancy; full
    capacity does not evict oldest; extreme coordinate deltas can overflow the
    contact square sum; downstream reward/render/audio behavior has separate owners.
