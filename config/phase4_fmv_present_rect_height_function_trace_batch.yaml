jobs:
  - &function_job
    id: present_rect_function_native
    recipe: loadStateAndRun
    state_path: ~/Downloads/ABL/movies/Phase4/E15_fmv_skip.movie.sav
    auto_select_disc: false
    expected_media: *pristine_media
    movie:
      path: ~/Downloads/ABL/movies/Phase4/E15_fmv_skip.movie.json
      start_frame: 0
    staged_prelude: &precise_stage
      kind: movie_advance
      target_frame: 160
      max_frames: 160
    instrumentation: &height_function_trace
      - method: functionTrace.start
        params:
          functions: [0x800B6A7C]
          all_symbols: false
          capture_memory: false
          max_events: 32
    run: &precise_run {movie_frame: 260}
    capture: &precise_capture
      trigger: e15_present_rect_function_trace_endpoint
      include_registers: true
      trace_limit: 64
      memory_dumps:
        - {label: present_rect, address: 0x800CAC04, length: 0x8}
        - {label: cached_height, address: 0x800B9A5C, length: 0x4}
        - {label: selected_frame_limit, address: 0x80131EEE, length: 0x2}
        - {label: fmv_running_latch, address: 0x80082250, length: 0x4}
        - {label: scene, address: 0x80082504, length: 0x4}
  - <<: *function_job
    id: present_rect_function_repeat
    staged_prelude: *precise_stage
    instrumentation: *height_function_trace
    run: *precise_run
    capture: *precise_capture

control_pairs:
  - positive_job: present_rect_function_native
    negative_job: present_rect_function_repeat
    assertion: >-
      Both jobs replay unmodified pristine code from the identical inspected
      E15 state/movie anchor and differ in no guest input, code, memory or
      observer configuration. Each must retain the same complete six-event
      entry/exit sequence for function 0x800B6A7C called from 0x800B6C24,
      with contiguous indexes beginning at one and equal terminal captures.
      Saturation, more or fewer than three balanced calls, another caller,
      sequence drift or endpoint divergence falsifies cardinality closure.

