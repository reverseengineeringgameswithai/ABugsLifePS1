static_successor:
  closed_sub_boundary: decode_timeout_recovery_coordinate_state_ownership
  next_lane: static
  packet_hypothesis: >-
    Timeout copies the newly selected RECT slot's width/height into the
    presentation RECT before clearing rect_ready and returning.
  packet_falsifier: >-
    Reject the packet hypothesis if the selected-slot loads or presentation
    stores resolve to fields other than width/height in the authoritative
    RECT layouts.
  corrected_claim: >-
    The pristine decode-poll helper has one direct player caller and one
    conventional return. An already-ready record and a record made ready by
    the decrement-before-test 0x00800000 poll both converge on the same final
    rect-ready clear. Timeout emits the diagnostic, publishes ready one,
    normalizes active_rect_index to old==0, copies the newly selected RECT
    slot's raw 16-bit signed x/y coordinates into the presentation RECT, does
    not write its width/height fields, and then clears ready before returning.
  corrected_falsifier: >-
    Reject if the function/caller frontier drifts, another exit bypasses the
    final ready clear, the budget or decrement/test order changes, timeout
    omits the ready publication, the active index is not old==0, the selected
    RECT slot or x/y copy differs, either width/height destination is written,
    the authoritative RECT layouts drift, the 0x800CABE0 pointer chain is
    incomplete, or a load-bearing opcode/artifact/source mutation leaves the
    focused guard green.
  not_claimed:
    - natural timeout frequency or trigger
    - visible timeout behavior
    - malformed-media policy
    - CD retry behavior
    - lifecycle or any other nine-dimension promotion
