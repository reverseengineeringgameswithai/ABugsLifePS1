pass_table_record:
  stride: 0x14
  sentinel: {field: flags, predicate: signed_u16_bit15_set}
  fields:
    - {offset: 0x00, width: s32, name: x}
    - {offset: 0x04, width: s32, name: y}
    - {offset: 0x08, width: s32, name: z}
    - {offset: 0x0C, width: s16, name: extent}
    - {offset: 0x0E, width: u16, name: flags}
    - {offset: 0x10, width: u32, name: source_pointer}
  nested_payload_field: source + (0x1C if flags bit 0x08 else 0x14)

