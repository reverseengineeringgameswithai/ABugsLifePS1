  - id: contact_pool_ttl_retirement
    title: Contact slots retire by TTL expiry — why the pool never fills
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: []
      note: >
        the 42 centrally declared strict-pristine anchors (pinned in the artifact); the TTL countdown
        itself was first observed in red_berry_thrown.sav during the drainer run
        (analysis/phase3_unknown_fields.json, which pins that save), and the capacity
        hang in analysis/phase2_capacity_hang_proof.json.
    machine: [config/record_types.yaml, config/semantic_state.yaml]
    evidence: analysis/phase3_record_probe.json
    command: python3 tools/phase3_record_types.py --probe
    guard: tests/test_phase3_records.py::test_pristine_never_approaches_the_contact_capacity_hang
    canon: ObsidianVault/Canon/Systems/SYS_record_layouts_and_lifetimes.md
    mod_contract: >
      +0x22 is a TIME-TO-LIVE COUNTDOWN (not a type); the slot is RETIRED at 0. That is
      the ONLY reclamation mechanism - contacts free themselves. The allocator
      (0x80059E44) is a free-slot search with NO full-array escape, so an all-64
      occupied pool HANGS the game. Pristine peaks at 4/64 (headroom 60) precisely
      BECAUSE TTLs expire. UNSAFE: a mod that REFRESHES TTLs, or holds slots open,
      destroys the mechanism that keeps the pool drained and can reach the hang.
    supersedes:
      - "contact +0x22 named 'active_type' (it is a TTL countdown; the walker gate's
         '> 0' means 'TTL not expired', not 'has a type')"
      - "occupancy measured as 'slot has non-zero bytes' (dead slots keep RESIDUE -
         that metric falsely reads 64/64)"
    residuals: "contact +0x26 counts down beside the TTL and freezes at expiry; purpose unproven."

  - id: transition_ownership_and_load_gap
    title: Scene-transition ownership, the load gap, and the full actor rosters
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: []
      note: all 16 from-boot go_to_end movies (hash-pinned in the artifact)
    machine: [analysis/phase3_transition_reset.json, config/record_types.yaml]
    evidence: analysis/phase3_transition_reset.json
    command: python3 tools/phase3_transition_reset.py --all
    guard: tests/test_phase3_transition.py
    canon: ObsidianVault/Canon/Systems/SYS_record_layouts_and_lifetimes.md
    mod_contract: >
      THE SCENE ID (0x80082504) FLIPS 450-1170 FRAMES BEFORE THE WORLD EXISTS - a mod
      hooking "scene changed" runs in an EMPTY world for 8-20 seconds; wait for the
      actor roster (0x8009FE04) to populate OR health_true > 0 (BOTH signals are
      needed: Bug Bar loads no roster, and 4 stages write health after the roster).
      THE LOAD OWNS THE WORLD; THE EXIT FREES NOTHING - actor/plant/contact data stays
      resident and stale, so reading those tables in the shell reads the PREVIOUS
      level. SESSION-OWNED (a mod must NOT reinitialise these on load, or it wipes the
      player's progress): health_true, lives, grain_count, enemy_permanence_quota, seed
      counters. CAPACITY: the actor roster is a FIXED 40 slots and FOUR stages load
      exactly 40 (Tunnels, Riverbed Run, The Tree, Riverbed Flight) - a mod adding an
      actor there has NOWHERE to put it.
    supersedes:
      - "the LEVEL01-only load gap of 540 frames presented as THE gap (it is a range,
         450-1170)"
      - "'world ready = actor roster populated' (roster-only readiness mis-reported Bug
         Bar's gap as 7680 frames; Bug Bar loads NO roster)"
    residuals: >
      Training plus all 15 campaign stages are measured. All twelve required record
      families now have an evidence-backed ownership model or a structured blocker;
      the frontend create/save/load/delete lifecycle remains explicitly blocked for a
      future frontend campaign rather than being assigned a guessed reset law.

