schema: abl-phase4-live-escalation-source/1
description: >
  Pre-run declarations for Phase-4 live DuckStation escalation. The generated
  analysis ledger validates each declaration against the current offline queue.
entries:
  - id: P4-ITER69-A11-MISSING-CAPSULE
    state: executed
    target_row: A11_seed_as_weapon
    hypothesis: >
      The pinned seed-as-enemy movie retains a frame-boundary seed release,
      landing, target-state change, and passive block-flow signature that can
      distinguish the two statically known resident seed-contact arms without
      treating the filename as enemy-family authority.
    relevant_capsules:
      - movie: movies/seed_as_enemy.movie.json
        movie_sha256: 6073e177ef57b485bec83c8afdd7b7a7650fd15ee589991fdbf9138b0f4ba915
        capsule_manifest_sha256: 84b553e7a1712076b80ead43a452fd4638f2661e03adf419fc386a554f4a854a
        capsule_tree_sha256: c9444d2f6f43af9e0c98cb991346d62bb8bf87ac44901073a56fabaabf221044
    offline_queries:
      - command: >-
          python3 tools/phase4_offline_queue.py --movie-root
          ~/Downloads/ABL/movies --check
        window: complete recursively inventoried movie tree and all 107 queue rows
        domains: [fixture_hashes, movie_metadata, capsule_index, queue_classification]
        answer: >
          A11 is queue rank 31 and live_required. Its centrally pinned v3 movie
          has 461 frames and exact paired pristine-class state, but no retained
          capsule or offline frame domain.
      - command: >-
          jq '{version,game_serial,initial_frame,frame_count:(.frames|length),start_state,
          square_edges:[range(0; .frames|length) as $i | .frames[$i] as $f |
          select(($f.ports["0"].square // false) and (($i==0) or
          ((.frames[$i-1].ports["0"].square // false)|not))) | $f.frame]}'
          ~/Downloads/ABL/movies/seed_as_enemy.movie.json
        window: movie frames 0 through 460, with input edges at 58 and 327
        domains: [movie_inputs, declared_start_state_metadata]
        answer: >
          The recording is save-anchored, not from boot; Square edges occur at
          frames 58 and 327. The JSON serial is metadata only, while the central
          movie/state byte pins independently match current files.
      - command: >-
          jq '.controls.A11_seed_as_weapon'
          analysis/phase2_final_action_pairs.json
        window: historical source frames 307 through 437 and the bounded post-drop trial
        domains: [retained_ram_outcome, movie_input, static_code_identity]
        answer: >
          Earlier evidence retains press versus no-press outcome and two static
          -20 store candidates, but explicitly lacks a cycle-neutral runtime arm
          identity and cannot supply current frame-domain reconstruction.
      - command: >-
          (cd ~/Downloads/ABL-external-evidence/duckstation-runtimes/trace-capsule-v1-20260718
          && sha256sum -c SHA256SUMS)
        window: complete preserved 2026-07-18 DuckStation app-root
        domains: [runtime_executable, resources, translations, companion_libraries]
        answer: >
          All 207 manifest entries pass; the runnable duckstation-qt hash is
          55d589032641ad0904526742f2209c034a710a162ebba3e1bc04b4c5da6075a8,
          equal to the capsule binary identity. The identity-only lone binary is
          not a runnable input.
      - command: >-
          python3 tools/phase4_offline_seed_actions_batch.py --external-output
          ~/Downloads/ABL-external-evidence/derived/Phase4/seed-actions-v1/index.json
          --check
        window: all 462 retained records for movie frames 0 through 461
        domains: [registers, ram, vram, spu_ram, block_flow]
        answer: >
          Reconstructed all records with the exact pinned reader. Detachment is
          frame 329, -20 target knockback is frame 349, decay ends at frame 388,
          and live-table removal is frame 389. The contact-vs-actor arm block
          start is present at the hit; the proximity twin arm block is absent.
    answers_obtained: >
      The exact movie/state hashes, save anchor, 461-frame extent, two Square
      edges, prior positive/negative outcome, and two static contact-arm
      candidates were known before collection. The complete current capsule now
      reconstructs all register/RAM/VRAM/SPU-RAM and passive block-flow records;
      the tracked offline batch retains the concrete event joins above.
    missing_information: >
      Collection closed the named missing frame-boundary domains. Remaining
      information absent from counts-mode capsules is exact-instruction/cycle
      attribution inside the covered arm block, controlled contact-kind mapping,
      and eligible-enemy family breadth. The JSON serial is not media proof.
    live_experiment: >
      In two freshly created isolated DuckStation profiles under /var/tmp, boot
      the hash-pinned pristine CUE with only the complete preserved runtime at
      ~/Downloads/ABL-external-evidence/duckstation-runtimes/trace-capsule-v1-20260718/duckstation-qt,
      inspect the paired state before load, replay all 461 frames, and collect
      counts-mode capsules into a new superseding external preservation pair
      without modifying the movie, state, or existing capsule roots.
    native_control: >
      For each collection, the capsule collector must reload the same pristine
      start state and run movie.traceToFrame through frame 461 as an independent
      cached-interpreter control, requiring exact RAM, VRAM, SPU-RAM, registers,
      frame/cycle/PC, and serialized full-state fingerprints with no truncation.
    expected_evidence: >
      Two byte-identical frame-domain chunk sets, complete manifests with current
      movie/state/media/source/binary hashes, and offline-queryable landing/change
      windows and block-start counts. This may narrow or distinguish the runtime
      arm but will not by itself prove enemy-family breadth or every-cycle writes.
    priority_justification:
      reason: >
        A11 is the highest-ranked live_required row and forms one coherent seed
        manipulation/contact cluster with the simultaneously selected A10 row.
      higher_priority_offline_ready: >
        None; the freshly regenerated 107-row queue reports offline_ready=0.
      load_bearing_evidence: >
        Queue rank 31, current central movie/state pins, and an empty relevant-
        capsule set mechanically require collection before offline analysis.
