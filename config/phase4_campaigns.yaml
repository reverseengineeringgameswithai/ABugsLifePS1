      positive: [Active-sector origin +2048, six current-sector plane reference-Y fields +64, natural sector-177 exit, explicit query gate 1]
      negative: [Distant non-candidate sector +2048, timing-matched neutral branches, explicit query gate 0, paused player]
    breadth:
      stages: Training, stages 1 through 15, and all three bonus stages with exact runtime table rows.
      variants: Flat/slope planes, non-floor orientations, ordinary movement, jump proposal, grounded/airborne state, and region codes 0 through 4.
      lifecycles: Cold boot, save load, pause/resume, native death/respawn, scene unload/reload, and natural exit transition.
      exceptional_paths: Riverbed Flight retains a valid 380-sector table but bypasses the ordinary player-candidate boundary; E04/E08/E10 consumers remain separately owned.
    frontier:
      functions: [sector converter 0x80030F60, grid 0x800313A8, resolver chain 0x800345CC..0x80036E70, candidate/ground/point tests 0x80037320..0x80038E48, region query 0x80038F38]
      dispatch: Direct resident calls; the player integrator builds its own list, while 0x80037320 is the separate entity/projectile candidate builder.
      assets: Twenty-four pinned collision-classified RAW files were decompressed; all fourteen 0x0103/0x0104 marker pairs semantically round-tripped.
      overlays: The recovered E02 code and globals are resident; scene-local plane/block payloads are rebuilt from the active LEVEL.RAW.
      typed_state: 0x30 sector records, 0x20 signed plane records, u32 candidate pointers/count, u16 owning-sector IDs, signed player XYZ/floor fields, and signed region codes.
      readers: Grid/candidate builders, three resolver passes, ground/spawn queries, player/mover/camera callers, checkpoint and region/exit consumers.
      writers: Load-time converter/grid, per-use candidate reset/append at 0x800368E8, resolved XYZ at 0x80036CE8/EC/F0, final Y restore at 0x80036D54, and current-sector publication.
      unknown_boundaries: Visible terrain, camera behavior, mover policy, hazards, objectives and transition dispatch have explicit separate row owners.
    lifecycle:
      initialization: Hash-pinned LEVEL.RAW is decompressed and converted into the sector table and scene-local plane heap before gameplay use.
      capacity: Grid scans are bounded at 700 sectors; pointer storage ends after 400 u32 slots and the retail append writer has no bounds check.
      allocation_reuse: Resident table/scratch addresses are reused; scene load replaces rows and plane pointers, and LEVEL01 reload reproduced the original exact table hash.
      reset: Candidate count/list is reset and overwritten per integrator/entity use; pause freezes player/floor state and resume rebuilds candidates.
      retirement: Scene unload retires old table contents and every scene-local block/plane pointer before the next conversion.
      unload_transition: LEVEL01 and LEVEL02 table hashes differ, then LEVEL01 unload/reload restores the exact original hash.
      death_respawn: Native same-scene death decrements lives, restores health 4, and returns to grounded collision-aware locomotion.
      persistence: Collision tables, candidates and current sector are transient world state, not saved progression identity.
    source_status:
      matching_c: src/main/80038f38_sector_region_code_query.c is matching C; no larger resolver matching-C claim is made.
      semantic_c: collision_source_converter, collision_plane_resolver and movement_integrator src_re files are documentation-grade only.
      asm: Thirteen resident frontier regions are byte-matched handwritten build units and pinned by pristine hashes/opcodes.
      schemas: config/phase4_collision.yaml binds sector, plane, candidate, capacity, asset and MOD contracts.
      registries: Baseline, campaign, findings, inventory and coverage layers carry the evidence-linked E02 conclusion.
    findings: [collision_floor_plane_resolver]
    bounded_residuals:
      - boundary: Visible terrain, camera modes/boom policy and mover behavior
        evidence: E02 binds collision inputs/outputs only; E01, E04 and E08 retain rendering, camera and mover policy while consuming bounded collision interfaces.
        next_experiment: Complete those campaigns using their own visual/camera/mover controls without reclassifying E02 plane records.
        intersects_behavior: false
      - boundary: Hazards, damage, objectives and scene-transition dispatch
        evidence: Region codes and collision contacts are typed producers; E10, lifecycle, F rows and loading/overlay rows retain their downstream decisions.
        next_experiment: Complete each consumer campaign using E02's retained interface as a dependency rather than inheriting collision ownership.
        intersects_behavior: false

  - id: safe_respawn_anchor
    family: player_lifecycle
    rows: [C15_respawn_anchor]
    status: active
    scope: >
      Resident safe-position capture/consume dataflow, death-class position
      selection, authored checkpoint/setpiece sources, reset and persistence
      policy, and stage breadth.
    non_scope: >
      C16 owns lives/game-over/Continue policy; E10 owns hazard-family policy;
      E02 owns collision; E14 owns card serialization; E16 owns generic
      overlay/resource loading. Their interfaces do not confer C15 completion.
    exit_decision: >
      Active and incomplete. Centrally pinned LEVEL02 pit and Bug Bar contact
      replays now prove
      the gated continuous safe-anchor interface, a natural 3/5-to-4/4 reset,
      an input-negative no-respawn control, and two same-code anchor mutation
      pairs. The exact frame-157 owner is now causal: pristine overlay
      0x800B3C54 selects scene-local row 6 and writes safe XYZ before resident
      0x8005B134 copies it to live XYZ. Separately, changing only Bug Bar
      fatal-state safe X by +4096 changes first-completed-respawn safe/live X
      by exactly +4096 with identical bounded execution coverage. Existing
      scene-10 and scene-4 pit recordings now add two exact one-frame reset
      boundaries: a safe-X-only +4096 perturbation is replaced before the same
      resident safe-to-live chain in both, while the continuous safe-XYZ stores
      do not execute. Complete bounded writer logs now attribute those tuples:
      scene 10 runs the pristine LEVEL10 0x800B3ADC nearest-row/ground function,
      while scene 4 runs the pristine LEVEL04 0x800B3C5C fixed-tuple/ground
      function and writes heading 2048. Access watches are attribution-only;
      the passive branch pairs remain timing and behavioral authority. A
      separate whole-staged-input static census now finds 21 direct safe-tuple
      stores in five of eleven pristine LEVEL.BIN inputs. An existing scene-6
      death replay now activates the previously static-only pristine LEVEL06
      fixed initializer at movie frame 488: the exact resident scene selector,
      JAL, 42/42 initializer PCs and four direct stores are reproduced. Three
      same-entry store suppressions retain only the prior X, Y or Z, and a
      one-unit heading-source change changes only the retained heading result;
      all branches return at the same cycle/frame/PC/SP boundary. An existing
      pristine scene-8 anchor now activates the exact LEVEL08 initializer too:
      passive natural coverage reaches all 27 PCs while a one-byte response-only
      control reaches none, seven complete writes install fixed safe/live state,
      and same-entry X/heading source controls change only their predicted fields.
      A new pristine from-boot scene-3 replay closes the bounded authored-row
      source gap: the byte-matched resident DAT parser populates shared type-table
      slot 1 at 0x80096DA4 with LEVEL03/LEVEL.DAT offset 0x458, and the live
      record plus selected row 6 are byte-identical to that hash-pinned asset.
      Joined to the prior row-6 mutation, this proves the selector causally
      consumes that authored coordinate row. A new exact-boundary denial clears
      only player status mask 0x0010 at frame 156. The LEVEL03 selector then
      executes only its 17-PC gate/return path, performs no safe-XYZ store, and
      the coverage-identical resident handler consumes the prior safe anchor.
      Capsule-first same-state controls now extend that one-bit denial to the
      independent LEVEL10 nearest-row writer and the LEVEL04 fixed-tuple writer.
      Each branch changes only byte 0x800A6590, skips every decisive writer
      store, and leaves the resident handler's exact passive coverage unchanged
      while it consumes the prior safe tuple. This proves mask necessity across
      the two known direct row selectors plus one fixed selector, not who sets
      or clears the mask, its whole-word/general policy, all overlays or death
      classes, indirect writers, persistence or a player-visible checkpoint.
