schema: abl-phase4-offline-fmv-batch-source/1
description: >
  Declarative selection and falsification contract for the E15 Start-skip capsule
  and its C16 natural-LOSE lifecycle control. The batch reconstructs typed values
  only at frame boundaries and guards Region-B fields by exact FMV.BIN head
  identity. It does not promote passive block starts or RAM/VRAM/SPU-RAM
  correlations into exact writer, GPU, DMA, voice, or transition ownership.
selected_rows: [E15_fmv]
