  categories:
  - id: callers
    disposition: required
    evidence: 'Extracted by inverting the whole 1,190-record call graph in analysis/phase4_static_frontier_index.json,
      not by a store-site census.

      '
  - id: callees
    disposition: required
    evidence: Transitive direct-call closure from the two declared roots.
  - id: callbacks
    disposition: required
    evidence: 'ENUMERATED BY DERIVATION, NOT BOUNDED. tools/phase4_callback_probe.c decodes every aligned
      word of all 21 hash-verified images and reports every code address materialised by an adjacent lui/addiu
      or lui/ori pair, classified by how the value leaves the site: stored to a slot, passed in an argument
      register at a jal, or called through jalr. Every retained site lands EXACTLY on a function entry,
      which is the check that the probe is finding function pointers rather than constants. The registration
      groups become callback groups here, each emitted complete=false, because the probe is POSITIVE-ONLY
      -- a pointer built across a basic block, loaded out of data, or copied through a third register
      is invisible to it. The earlier not_applicable was unsound for the opposite reason: the static index
      has no callback-record field, so "zero callback records" was an absence of data.

      '
  - id: indirect_tables
    disposition: required
    evidence: 'Every indirect call site inside the closure is emitted as its own table with complete=false,
      so an unenumerated target set cannot pass silently.

      '
  - id: overlays
    disposition: required
    evidence: 'All 21 shipped overlay images are declared in the universe with their expected sha256 from
      the static index.

      '
  - id: readers
    disposition: required
    evidence: Static-index memory accesses resolved into the declared windows.
  - id: writers
    disposition: required
    evidence: Static-index memory accesses resolved into the declared windows.
  - id: downstream_consumers
    disposition: required
    evidence: 'Assigned explicitly by consumer_category_overrides below; the whole-universe access seed
      brings every window reader into the frontier, and the scene-flow readers are tagged as downstream
      consumers rather than inferred from reachability.

      '
