schema: abl-phase4-berry-throw/1
source_state: original_game
owner: original_game.berry_throw

decoded_input:
  action_word: 0x80082488
  previous_pad_word: 0x80082380
  square_mask: '0x8000'
  edge: fresh_press

controller:
  player: 0x800A6500
  windup:
    offset: 0x86
    width: s16
    arm: 18
    dispatch_at: 10
    arm_read_max_exclusive: 7
  gates:
    berries_in_flight: {offset: 0x96, width: u8, max_exclusive: 4}
    special_mode: {offset: 0xA3, width: u8, required: 0}
    shared_action_timer: {offset: 0x7A, width: s16, required: 0}
    vertical_action_aux: {offset: 0x84, width: s16, required: 0}
    action_gate_9e: {offset: 0x9E, width: u16, max_exclusive: 12}
    blocked_animation_ids: [8, 10, 13, 17]

selectors:
  field: {address: 0x800A6597, player_offset: 0x97, width: u8}
  jump_table: {address: 0x8001B1C0, entries: 5, extendable: false}
  rows:
    - {selector: 0, berry: red, primary_type: 2, aim: target_helper}
    - {selector: 1, berry: blue, primary_type: 5, aim: target_helper}
    - {selector: 2, berry: homing, primary_type: 8, aim: fixed_heading_minus_2048, secondary_type: 16}
    - {selector: 3, berry: gold, primary_type: 11, aim: target_helper}
    - {selector: 4, berry: mega, primary_type: 45, aim: fixed_heading_minus_2048, secondary_type: 48}

spawn:
  dispatch: 0x800470AC
  aim_helper: 0x80046D24
  allocator: 0x8005A0E0
  position:
    xz: player position plus one-quarter-heading LUT offset
    y_offset: -12800
  horizontal_velocity: 3 * (signed 12-bit heading LUT sample >> 4)
  vertical_velocity_homing_primary: -2048
  gravity_per_projectile_update: 128
  audio_sfx_id: 2

pool:
  base: 0x800B0D18
  record_size: 0x38
  capacity: 64
  cursor: 0x8008234C
  allocator_policy: round_robin_free_slot_search
  full_pool_escape: false
  descriptor_table: {address: 0x8007941C, stride: 20}
  integration_order:
    - position += current velocity
    - velocity_y += gravity
    - lifetime_ttl -= 1
  primary_secondary:
    homing: {primary: 8, acquisition_mode: 1, secondary: 16, spawn_return_pc: 0x80057584}
    mega: {primary: 45, acquisition_mode: 0, secondary: 48, spawn_return_pc: 0x80057540}
  homing:
    target_table: 0x80090748
    valid_flags: bit_0x1_set_and_0xA0_clear
    selection: nearest_squared_distance_in_xz
    seek_flag: 0x08

lifecycle:
  initialization: Fresh Square under every gate writes windup 18; a valid selector increments the u8 in-flight count and allocates one native contact record.
  capacity: The shared pool has exactly 64 records; the native allocator has no escape when all records satisfy its occupied predicate.
  allocation_reuse: The round-robin cursor identifies the next search position, not stable ownership or overwrite-oldest behavior.
  reset: Native projectile cleanup decrements the in-flight count; respawn clears it at 0x8005B304 and gameplay reset clears the shared pool/cursor.
  retirement: Straight primaries retire on TTL/contact/range paths; homing and mega primaries acquire a target and spawn types 16/48 or take their explicit no-target fallback.
  unload_transition: Resident controller/allocator code persists while scene initialization replaces transient pool, player, and actor-table state.
  death_respawn: Same-scene native respawn clears marked windup/in-flight state and accepts a fresh post-respawn throw.
  persistence: Windup, in-flight ownership, equipped selector, target pointer, trajectories, and pool records are transient gameplay state, not progression facts.

mod_contract:
  owner: Preserve the resident input, player-update, dispatch, allocator, projectile-update, contact, damage, render, audio, and cleanup order; name every hook owner.
  readers: Enumerate decoded input, windup, selector, in-flight count, player transform, type descriptors, contact pool, target table, collision/damage, renderer, audio, pause, death/respawn, transition, boss, and stage-special consumers.
  writers: Do not add unordered writes to input edge state, windup, selector, in-flight count, cursor, record position/velocity/gravity/TTL/type fields, target pointers, actor damage state, or lifecycle clears.
  valid_domains: Selector is u8 0..4; windup is context-reused s16; in-flight is u8 with native throw admission below 4; heading is 0..4095; record position/velocity are s32; gravity is s16; TTL and descriptors are typed fields.
  initialization: Initialize MOD-private selector/projectile state before its first resident read and never infer ownership from stale bytes or a pool slot index.
  reset: Clear private windup, target, projectile, and input-edge state on retirement, pause-shell reset, damage/death/respawn/reload, takeover, and every scene/overlay transition.
  retirement: Release every in-flight ownership unit exactly once and retire injected input and overlay-scoped hooks before player, pool, actor, boss, renderer, or audio owners unload.
  consumers: Input, player, allocator, projectile updater, collision, enemy damage/immunity, renderer/animation, camera, audio, pause, respawn, scenes, bosses, plants, shooter objects, and special controllers.
  capacity: Declare every hook/cave/table expansion bound; never let all 64 native pool records remain allocator-occupied because the pristine search has no full-pool escape.
  residency: Keep persistent private state outside overlay-owned memory; target pointers and overlay consumers are valid only for their declared owner lifetime.
  unsafe_assumptions: Emulator frames are not projectile updates; TTL integrates after current velocity; selectors 2/4 skip the ordinary aim helper; a homing primary and secondary are distinct allocations; cursor is not object identity; Riverbed Flight permits throws while Bonus 2 does not; damage/immunity and asset decoding retain separate owners.
