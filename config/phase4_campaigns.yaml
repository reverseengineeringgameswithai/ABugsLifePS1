child_campaigns:
  - id: grain_collection_harvester
    family: collectibles_equipment_rewards
    rows: [C01_grain_pickup, C02_fifty_grain_reward, C13_grain_harvester]
    status: active
    scope: >
      Pristine grain pickup, exact 49-to-50 reward path, grain-harvester
      actor/asset ownership, bit-0x80 equip/follow state, kind-0x14 attraction
      construction, ctor-0x51 contact convergence and action-20 grain handoff.
    non_scope: >
      FLIK letters, berries, seed tokens, health leaves, telescope, HUD/results,
      generic contact capacity, audio asset identity, save/frontend persistence
      and stage objectives retain their registered owners.
    exit_decision: >
      Active and incomplete. Retained save-start indexes and pristine static
      code now bind the harvester owner, source radius, convergence law and
      reachable grain-50 health store, but cold-boot oracle, same-anchor
      denial/radius controls, lifecycle breadth and persistence remain open.
    note: ObsidianVault/Playbooks/Game Solving Roadmap/Game Solving Campaign - Grain Collection and Harvester.md
    mods_disposition: no_mod_change
    evidence:
      frontier:
        - {artifact: analysis/phase4_collectibles_frontier.json, sha256: 9fa2295991dc205ce734fde4ab354a1d6b2bde69093c7c4d8e1ae10efc5745a7, json_path: valid, op: eq, expected: true}
        - {artifact: analysis/phase4_collectibles_frontier.json, sha256: 9fa2295991dc205ce734fde4ab354a1d6b2bde69093c7c4d8e1ae10efc5745a7, json_path: static_frontier.actor_asset_ownership.actor_id, op: eq, expected: 35}
        - {artifact: analysis/phase4_collectibles_frontier.json, sha256: 9fa2295991dc205ce734fde4ab354a1d6b2bde69093c7c4d8e1ae10efc5745a7, json_path: offline_localization.C13_grain_harvester.pickup_boundary.actor_player_delta, op: eq, expected: [0, 192, 0]}
        - {artifact: analysis/phase4_collectibles_frontier.json, sha256: 9fa2295991dc205ce734fde4ab354a1d6b2bde69093c7c4d8e1ae10efc5745a7, json_path: static_frontier.grain_attraction_source.squared_distance_max, op: eq, expected: 89999}
      source:
        - {artifact: analysis/phase4_collectibles_frontier.json, sha256: 9fa2295991dc205ce734fde4ab354a1d6b2bde69093c7c4d8e1ae10efc5745a7, json_path: static_frontier.instruction_words.0x80051EB0, op: eq, expected: '0xA4236590'}
        - {artifact: analysis/phase4_collectibles_frontier.json, sha256: 9fa2295991dc205ce734fde4ab354a1d6b2bde69093c7c4d8e1ae10efc5745a7, json_path: static_frontier.fifty_grain_reward.progress_branch.reachable, op: eq, expected: false}
    controls:
      positive: [Retained frame-83 bit-0x80 acquisition/follow join, nine action-20 grain boundaries, pristine opcode/metadata reconstruction]
      negative: [Fixed unequal reward addresses reject a reachable progress write, save-start anchors reject cold-boot promotion]
    breadth:
      stages: Actor 35 is authored in six census stages; retained C13 behavior is localized only to Stage 1.
      variants: Ordinary C01 pickups, one 49-to-50 boundary and one harvester acquisition suffix are retained.
      lifecycles: Save-start acquisition and attached suffix only; cold boot, reset, death/respawn, unload/reload and persistence are open.
      exceptional_paths: Denial, full contact capacity, bit removal, missed attraction and reward-state variants are open.
    frontier:
      functions: [harvester equip/follow 0x80051DB4, source dispatcher 0x80053814, grain handler 0x80054EAC, contact allocator 0x80059E44, contact updater 0x8005A308]
      dispatch: Actor ID 35 resolves through the ID-minus-one table to 0x8005E17C; kind 0x14 with bit 0x80 constructs ctor 0x51/action 20.
      assets: CHARS3/FLIKHARV.ALL and FLIKHARV.ANM are hash-pinned and joined to actor ID 35.
      overlays: The recovered ownership path is resident; authored actor/source records are scene-owned.
      typed_state: Player power-up flags are resident u16 at 0x800A6590; fixed actor slot 63 and the 0x38-byte ctor-0x51 contact record are bounded.
      readers: Harvester preconditions, source distance gate, contact convergence and grain/reward readers are statically bounded.
      writers: Bit-0x80 store, actor follow stores, target=-1 store, convergence integration, grain increment and reachable health store are exact.
      unknown_boundaries: Cold-boot oracle, causal controls, lifecycle, capacity, denial, audio, HUD and persistence remain open.
    lifecycle:
      initialization: Actor ID 35 is authored in fixed slot 63; exact scene-load initialization remains dependency-owned.
      capacity: One fixed harvester actor and a shared 64-record contact pool; full-pool behavior remains open.
      allocation_reuse: ctor 0x51 uses the shared rotating contact allocator; reuse controls remain open.
      reset: No bit-removal, retry or checkpoint reset is promoted from the retained suffix.
      retirement: Action-20 pickup handoff is bounded; harvester retirement is open.
      unload_transition: Scene-owned actor/source retirement and rebuild are open.
      death_respawn: No death/respawn conclusion is made.
      persistence: No save/frontend persistence conclusion is made.
    source_status:
      matching_c: No new matching-C claim is made.
      semantic_c: src_re/grain_harvester_equipment_80051db4.c and src_re/grain_contact_convergence_8005a308.c are documentation-grade reconstructions.
      asm: Pristine executable slices and instruction words bind the resident owners; the existing 0x8005A308 handwritten unit remains byte-matched.
      schemas: config/phase4_collectibles_frontier.yaml and config/semantic_state.yaml bind the selected state and assertions.
      registries: Campaign, inventory, coverage, debt and roadmap layers retain all three rows open.
    next_lane_override:
      lane: static
      reason: >
        The selected movie-ready packet binds static work; no exact live-only
        missing domain supersedes the remaining source, xref and lifecycle
        reconstruction boundary.
      evidence:
        - {artifact: analysis/phase4_collectibles_frontier.json, sha256: 9fa2295991dc205ce734fde4ab354a1d6b2bde69093c7c4d8e1ae10efc5745a7, json_path: campaign.next_lane, op: eq, expected: static}
      authoritative_paths:
        - analysis/phase4_collectibles_frontier.json
        - config/phase4_collectibles_frontier.yaml
        - src_re/grain_harvester_equipment_80051db4.c
        - src_re/grain_contact_convergence_8005a308.c
        - tests/test_phase4_collectibles_frontier.py
    bounded_residuals:
      - boundary: Cold-boot oracle and same-anchor causal controls
        evidence: >
          Every selected anchor begins from a pristine save. Static code and
          retained frame evidence bind ownership but do not reproduce boot
          acquisition or perturb only bit 0x80/radius at one anchor.
        next_experiment: >
          Exhaust remaining static xrefs and source status, then declare one
          exact same-anchor bit/radius control only if the next scheduler
          projection returns this campaign.
        intersects_behavior: true
      - boundary: Lifecycle, capacity and persistence breadth
        evidence: >
          The retained suffix covers acquisition/follow and nine action-20
          pickups, not pool exhaustion, denial, reset, death/respawn,
          unload/reload or saved progression.
        next_experiment: >
          Reuse an existing centrally declared fixture for the first missing
          lifecycle boundary before requesting any new operator recording.
        intersects_behavior: true

  - id: pause_shell
    family: hud_frontend_persistence
    rows: [A18_pause]
    status: completed
    scope: >
      Pristine A18 Start entry, ordinary resume, frozen gameplay ownership,
      continuing scene/GPU presentation, SPU release/restart, all gameplay
      contexts, Exit Level confirmation controls and frontend handoff.
    non_scope: >
      E12 audio internals, E13 HUD/results internals, E14 save persistence,
      E16 overlay/loading policy, stage objectives and MOD-private pause hooks
      retain their registered owners and are not promoted into A18.
    exit_decision: >
      A18 is complete because hash-pinned resident code, 19 strict-pristine
      gameplay anchors, execution and access traces, SPU snapshots, default-No
      and selected-Yes controls, and exact frontend output directly reproduce
      the bounded pause shell without an intersecting residual.
