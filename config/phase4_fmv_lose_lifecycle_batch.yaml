    auto_select_disc: false
    expected_media: *pristine_media
    instrumentation: *lose_trace
    run: *shared_run
    capture: *shared_capture

control_pairs:
  - positive_job: gameover_movie_positive
    negative_job: gameover_no_input_control
    assertion: >-
      From the identical inspected C16 game-over state and 1,600-frame bound,
      the positive job may differ only by the centrally pinned movie inputs.
      Retain the exact loader caller, selector arguments, selected frame limit,
      completion request and common teardown sequence. The no-input job is the
      native same-anchor control for whether those inputs select the LOSE path;
      neither branch may be generalized beyond this one game-over anchor.
