# Overlay decompilation track — SEPARATE from the resident substrate
# (config/segments.yml / tools/build_psx_exe.py). Each overlay is a standalone
# code image CdRead-loaded at a FIXED runtime VA (Region A for per-level
# LEVEL*.BIN swap buffers, Region B for MEMORY.BIN). Matched overlay functions
# are compiled at their load VA and spliced into a copy of the blob; the rebuilt
# blob must stay SHA-1-identical. Consumed by tools/build_overlay.py; the
# resident metric (analysis/decomp_progress.json) is never touched by this track.
#
# Blob paths name the hash-pinned pristine REBUILD staging tree directly.  OVL/
# extraction copies are not authority and are not clean-checkout dependencies.
# Blob VA mapping: VA = base + file_offset. LEVEL*.BIN carry a 4-byte ID word
# ("LEVE"/"leve") at +0; code entry `level_overlay_init` at +4. The C toolchain
# (compiler/flags/_gp) is shared with the resident substrate (config/segments.yml).
