schema_version: 1
description: Curated semantic addresses shared by RE notes, MOD tooling, and debugger scenarios.

namespaces:
  original: Confirmed or bounded state/functions owned by the retail game.
  mod_private: State/functions introduced and owned by a MOD module.
  hypothesis: Unresolved candidates that must never be emitted as confirmed constants.

