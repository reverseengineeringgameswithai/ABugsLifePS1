schema_version: 1
id: pristine_contact_respawn_safe_anchor
description: >-
  Replay the centrally pinned pristine Bug Bar contact-death lead, select
  ordinary respawn with a one-byte lives control, and prove that changing only
  fatal-state safe X controls the first completed resident respawn boundary.
target:
  disc: ~/Downloads/ABL/Disney-Pixar A Bug's Life (v1.0).cue
  expected_serial: SCUS-94288
launch: {profile: generic}
playback:
  movie: movies/Phase4/C16_gameover_continue.movie.json
  load_start_state: true
  require_reproducible: true
setup:
  - type: rpc
    id: select_ordinary_respawn
    method: debugger.writeU8
    params: {address: 0x800A65A0, value: 1}
phases:
  - id: fatal_contact_retains_continuous_safe_anchor
    trigger: {type: movie_frame, target: 350, max_frames: 400, timeout_seconds: 120}
    assertions:
      - {id: c15_contact_fatal_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 9}
      - {id: c15_contact_fatal_live_x, type: memory, address: 0x800A6500, width: s32, op: eq, expected: -27693}
      - {id: c15_contact_fatal_anchor_x, type: memory, address: 0x800A6550, width: s32, op: eq, expected: -23491}
      - {id: c15_contact_fatal_anchor_y, type: memory, address: 0x800A6554, width: s32, op: eq, expected: -112966}
      - {id: c15_contact_fatal_anchor_z, type: memory, address: 0x800A6558, width: s32, op: eq, expected: -142999}
      - {id: c15_contact_fatal_health, type: memory, address: 0x800A6594, width: s16, op: eq, expected: -1}
      - {id: c15_contact_fatal_lives, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 1}
      - {id: c15_contact_movie_reproducible_before_mutation, type: rpc, method: movie.status, path: reproducible, op: eq, expected: true}
    after:
      - type: rpc
        id: change_only_fatal_safe_x
        method: debugger.writeU32
        params: {address: 0x800A6550, value: 0xFFFFB43D}
  - id: resident_respawn_consumes_mutated_safe_anchor
    trigger: {type: movie_frame, target: 355, max_frames: 10, timeout_seconds: 60}
    assertions:
      - {id: c15_contact_post_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 9}
      - {id: c15_contact_post_live_x, type: memory, address: 0x800A6500, width: s32, op: eq, expected: -19395}
      - {id: c15_contact_post_live_y, type: memory, address: 0x800A6504, width: s32, op: eq, expected: -112966}
      - {id: c15_contact_post_live_z, type: memory, address: 0x800A6508, width: s32, op: eq, expected: -142999}
      - {id: c15_contact_post_anchor_x, type: memory, address: 0x800A6550, width: s32, op: eq, expected: -19395}
      - {id: c15_contact_post_anchor_y, type: memory, address: 0x800A6554, width: s32, op: eq, expected: -112966}
      - {id: c15_contact_post_anchor_z, type: memory, address: 0x800A6558, width: s32, op: eq, expected: -142999}
      - {id: c15_contact_post_health_restored, type: memory, address: 0x800A6594, width: s16, op: eq, expected: 4}
      - {id: c15_contact_post_life_decremented, type: memory, address: 0x800A65A0, width: u8, op: eq, expected: 0}
      - {id: c15_contact_movie_reproducible_after_respawn, type: rpc, method: movie.status, path: reproducible, op: eq, expected: true}
