mod_contract:
  owner: Preserve E15 playback, skip, completion, transition and Region-B residency ordering; declare every FMV edit or hook.
  readers: Enumerate resident shell/wait code, FMV.BIN stream/decode code, libcd/libpress callbacks, frontend/movie-viewer callers and transition consumers before changing state.
  writers: Do not write the running latch, completion request, selected frame limit, backloc, overlay bytes or shell state outside the original ownership and residency window.
  valid_domains: Manifest paths and signed frame limits must remain within the exact 40-row table; Region-B fields are invalid once the FMV.BIN head identity is absent.
  initialization: Verify pristine FMV.BIN and executable identity, load Region B once, select the exact manifest row and initialize stream/decode state before playback.
  reset: Clear or rebuild stream, callback, shell and private state on stop, error, scene reset, state load and every subsequent playback.
  retirement: Stop callbacks and retire Region-B pointers exactly once before FMV.BIN unload or replacement.
  consumers: Boot logos, level cinematics, intro/lose paths, movie viewer, audio, frontend, results, scene loading and overlay ownership.
  capacity: Preserve the 40-entry dispatch/frame table and the original stream/ring-buffer bounds; any extension needs explicit storage and overflow guards.
  residency: Resident shell/load/wait code survives playback; FMV.BIN code and data are Region-B transient and must be identity-checked before typed access.
  unsafe_assumptions: >-
    A serial, filename, table row, state-anchored skip or natural level-A
    completion, nonzero coverage hit or stale Region-B address does not prove
    media origin, natural completion for another caller, movie-viewer
    ownership, error handling, or cross-playback persistence.
