  - id: audio_cinematics
    number: 11
    title: Audio and cinematics
    priority_tier: 1
    scope: SFX, voices, XA and music selection, FMV playback, skip and error paths, ownership, pause, stop, and transition behavior
    primary_rows: [E12_audio, E15_fmv]
    dependency_rows: [A18_pause, C05_three_tokens, C17_movie_viewer,
                      E13_hud_results, E14_frontend_save,
                      E16_streaming_overlays]
