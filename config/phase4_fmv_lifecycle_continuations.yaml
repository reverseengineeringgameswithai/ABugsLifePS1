boundary: >-
  The exact pristine post-return bytes and centrally pinned ASM owners classify
  every one of the nine resident fmv_bin_load consumers, including the repeated
  boot chain, all level/game-over transition continuations and the full Level-A
  reset owner. Matching loader C and its byte-exact six-call sequence prove that
  each invocation recopies FMV.BIN to Region B, then calls the synchronous
  player and post-player display initializer; the loader has no explicit
  Region-B unload or clear. The five player exit edges and common Pause/stop
  teardown are exact. cd_subsystem_init also registers callback 0x80045D5C for
  event class 0xF0000003/spec 0x8000; the callback stores 1 at resident field
  0x80082484, whose FMV consumer routes that exact value to common teardown.
  This is a confirmed static lifecycle sub-boundary, not complete lifecycle
  promotion. Native delivery/frequency, Pause result, visible failure outcomes
  and adjacent viewer/persistence/audio policy remain non-intersecting debt.
