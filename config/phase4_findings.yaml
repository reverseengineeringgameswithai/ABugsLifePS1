schema: abl-phase4-findings/1
description: >
  Findings are added only after a Phase-4 campaign produces new evidence. Each
  entry must satisfy all eight reusable-finding requirements; a finding alone
  cannot satisfy campaign coverage without its independently audited campaign
  or reviewed-absence record.
findings:
  - id: pause_shell_controller
    provenance:
      media: Hash-verified pristine Disney-Pixar A Bug's Life v1.0 CUE and track; ALLMODS and the non-pristine small_pause_issue save were not used as authority.
      executable: REBUILD/files/SCUS_942.88 SHA-256 1aa28954a1871d0799bf306a5ae746d17b143fce6d1965740f798862be519d20.
      overlay: Entry, gameplay state and pause render/menu owners are resident; current gameplay pools and overlay consumers freeze through the resident boundary.
      assets: Pause-menu imagery and transient screenshots are corroboration only; no copyrighted capture, save, movie, disc, BIOS or asset bytes are retained.
      trigger: Enter and resume with Start from nineteen strict-pristine gameplay anchors; hold Up during active/paused/resumed controls; then exercise default No and selected Yes exit confirmation.
      frame_or_cycle: Every anchor frame/cycle, the 60-frame ownership trace, SPU snapshots, exit writer events and 2400-frame frontend settle are retained in analysis/phase4_pause.json.
      observation: Gameplay semantic fields and actor/contact/plant/camera pools freeze while scene render, ordering-table, GPU DMA and presentation continue; sustain voices release during pause and restart after resume.
      inference: A18 is a resident shell that gates gameplay/HUD update owners while continuing presentation and explicitly handing audio voices and confirmed level exit to their downstream owners.
      causal_confirmation: Start-only entry/resume changes the u16 flag in all nineteen contexts; exact access events attribute the Yes branch to pause=0, transition=5 and fade=23 writers before the stable frontend scene-0 framebuffer.
      fixtures: [level02.sav, level_14.sav, phase3_pristine_training_gameplay_i5.sav, movies/Bonus_Level_03.movie.sav]
    machine:
      - config/phase4_pause.yaml
      - analysis/mechanics_baseline.yaml
      - analysis/phase4_pause.json
      - tools/scenarios/duckstation/pristine_pause_exit.yaml
    evidence:
      - {artifact: analysis/phase4_pause.json, sha256: 913ea4b05d0384951c6588df3c909ebfb1cb4d1e1082c5a0a83ec96aee3ed1f0, json_path: live.breadth.summary.anchors_compared, op: eq, expected: 19}
      - {artifact: analysis/phase4_pause.json, sha256: 913ea4b05d0384951c6588df3c909ebfb1cb4d1e1082c5a0a83ec96aee3ed1f0, json_path: live.ownership.summary.paused_player_fields_frozen, op: eq, expected: true}
      - {artifact: analysis/phase4_pause.json, sha256: 913ea4b05d0384951c6588df3c909ebfb1cb4d1e1082c5a0a83ec96aee3ed1f0, json_path: live.ownership.execution_trace.hit_counts.scene_render_driver, op: eq, expected: 20}
      - {artifact: analysis/phase4_pause.json, sha256: 913ea4b05d0384951c6588df3c909ebfb1cb4d1e1082c5a0a83ec96aee3ed1f0, json_path: live.audio.summary.paused_sustain, op: eq, expected: 0}
      - {artifact: analysis/phase4_pause.json, sha256: 913ea4b05d0384951c6588df3c909ebfb1cb4d1e1082c5a0a83ec96aee3ed1f0, json_path: live.exit.summary.positive_fade_write_low_half, op: eq, expected: 23}
      - {artifact: analysis/phase4_pause.json, sha256: 913ea4b05d0384951c6588df3c909ebfb1cb4d1e1082c5a0a83ec96aee3ed1f0, json_path: live.exit.summary.frontend_scene, op: eq, expected: 0}
    guard: tests/test_phase4_pause.py::test_retained_pause_evidence_recomputes_low_level_predicates
    knowledge:
      canon: ObsidianVault/Canon/Systems/SYS_pause_shell.md
      experiment: ObsidianVault/Experiments/Runtime Tests/EXP_2026-07-18_phase4_pause_shell.md
      mods:
        not_applicable: true
        reason: This finding records pristine original-game behavior and adds no MOD-private hook, cave, state or intended behavior.
    mod_contract:
      owner: Preserve decoded-input, gameplay state-machine, pause render/menu, transition and audio ordering; name every hook explicitly.
      readers: Enumerate input, pause, gameplay pools, camera, HUD, renderer, GPU, SPU, transition, frontend and overlay consumers.
      writers: Do not add unordered writes to pause, menu selection, transition, fade, gameplay pools, camera or SPU voice state.
      valid_domains: Pause is u16 0/1; decoded actions are u16; transition 5 is confirmed level exit; fade is written as u16 23.
      initialization: Initialize private pause/menu state before its first reader and never infer pause ownership from a static framebuffer.
      reset: Clear private pause ownership on resume, confirmed exit, death/respawn/reload, transition, frontend takeover and MOD unload.
      retirement: Retire injected input and private menu/audio state exactly once before the scene, overlay, renderer or audio owner unloads.
      consumers: Input, player, actors, contacts, plants, camera, HUD, renderer, GPU, SPU, stages, bonuses, bosses, transition, frontend and overlays.
      capacity: Declare all hooks, caves, menu/table bounds and preserve the native flag domain and fixed pool capacities.
      residency: Pause code/flag are resident; gameplay pools and overlays are scene-local; persistent MOD state must not use overlay memory.
      unsafe_assumptions: Pause does not freeze emulator time, rendering or every SPU register; changing paused frames do not imply gameplay motion; default confirmation is No; exit reaches frontend rather than respawn; E12/E13/E14/E16 remain independent.
    confidence: confirmed
    residuals: E12 audio internals, E13 HUD/results, E14 persistence and E16 loading/overlay internals remain independently registered; their pause-facing boundaries are directly captured and do not intersect completed A18 behavior.
    supersedes:
      - The partial A18 claim that freeze ownership, audio/render behavior, resume and Exit Level were unresolved.
      - The non-pristine small_pause_issue filename lead as an original-game authority; it is no longer consumed.

  - id: thud_reward_volley_frequency
    provenance:
      media: Hash-verified pristine Disney-Pixar A Bug's Life v1.0 CUE and track; the centrally pinned Thud movie/state pair is pristine-classified and ALLMODS was not used as authority.
      executable: REBUILD/files/SCUS_942.88 SHA-256 1aa28954a1871d0799bf306a5ae746d17b143fce6d1965740f798862be519d20; resident action-20 dispatch/grain semantics remain independently hash-bound.
      overlay: Save-owned 0x800B3ED4..0x800B4004 is exact SHA-256 10992dee6815d74e6b89109980f16d6c60f0230d94f52f0730b7e217d30badba and matches neither staged LEVEL08 candidate; no bare Region-A identity is generalized.
      assets: The external movie/state pair establishes the trigger and state anchor only; no copyrighted movie, save, disc, capture, model, texture, sound or other asset payload is retained.
      trigger: Replay the full existing Thud recording through nine settled passive targets, then replay target 970 twice and change only derived countdown 0x800B4CB4 from 9 to 6 before the next native iteration.
      frame_or_cycle: All nine cumulative coverage pairs are cycle-neutral. Matched branches share a full-RAM/register/cycle/PC/SP origin and end at the same emulator/movie frame, PC and SP; the action-9 path uses exactly one fewer CPU cycle.
      observation: >-
        Seven natural reset suffixes execute 70 allocator calls: 63 general
        paths, seven equality-to-five paths and 70 sound calls. Fourteen
        action-20 tails/grain stores and four action-9 handler/health stores
        execute; grain ends at 14 and neither action 9 nor 20 remains active.
        The first action-9 boundary raises true health 2 to 3 while slot 47 TTL
        changes 62 to 1.
      inference: Each recorded volley emits nine action-20 grain contacts and one action-9 health-leaf contact; four leaves are naturally collected in this replay and each increments true health. The action meanings come from hash-pinned resident dispatch/source evidence, not this save-owned address alone.
      causal_confirmation: At the equal origin, the one-byte-effective countdown 9-to-6 mutation makes the next decrement equal five and changes slot 17 from action/TTL/state 20/200/24 to 9/200/-42.
      fixtures: [thud_boss_movie.movie.json, thud_boss_movie.movie.sav]
    machine:
      - config/phase4_thud.yaml
      - config/phase4_contact_pool.yaml
      - analysis/phase4_thud_volley.json
      - tools/scenarios/duckstation/pristine_thud_reward_variant_control.yaml
      - tools/scenarios/duckstation/pristine_thud_action9_natural_pickup.yaml
    evidence:
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: matched_variant_control.runtime_identity.sha256, op: eq, expected: 10992dee6815d74e6b89109980f16d6c60f0230d94f52f0730b7e217d30badba}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: settled_boundaries.8.cumulative_counts.0x800b3ff0, op: eq, expected: 70}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: settled_boundaries.8.cumulative_counts.0x800b3f34, op: eq, expected: 7}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: settled_boundaries.8.cumulative_counts.0x800b3f7c, op: eq, expected: 63}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: settled_boundaries.8.cumulative_counts.0x80054f9c, op: eq, expected: 14}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: settled_boundaries.8.cumulative_counts.0x80058864, op: eq, expected: 4}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: first_natural_action9_pickup.0.snapshot.health, op: eq, expected: 2}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: first_natural_action9_pickup.1.snapshot.health, op: eq, expected: 3}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: static_action9_handler.sha256, op: eq, expected: e89382b9e86e29907d3cee300e6c7b706884bd20f352f2ff217c06e6f799f849}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: matched_variant_control.control_after.slot17.action_id, op: eq, expected: 20}
      - {artifact: analysis/phase4_thud_volley.json, sha256: ae923a520f57caeb244c670a27385491aac8359e3077816429d8ab28c6dca05d, json_path: matched_variant_control.mutation_after.slot17.action_id, op: eq, expected: 9}
    guard: tests/test_phase4_thud_volley.py::test_countdown_control_causally_selects_action9_variant
    knowledge:
      canon: ObsidianVault/Canon/Systems/SYS_thud_natural_defeat.md
      experiment: ObsidianVault/Experiments/Runtime Tests/EXP_2026-07-17_phase4_thud_reward_volley.md
      mods:
        not_applicable: true
        reason: This finding records pristine original-game behavior and adds no MOD-private hook, cave, state or intended behavior.
    mod_contract:
      owner: Preserve save-qualified Thud countdown/volley ownership, resident contact allocation/dispatch ownership and exact lifecycle ordering; explicitly name every hook.
      readers: Enumerate countdown, counter, contact action/TTL/state/class, allocator, action-9/action-20 dispatch, grain/health, rendering, audio, objective, retry and transition consumers.
      writers: Do not add unordered writes to countdown, contact records, grain, health, sound calls, boss reset, retirement or scene-transition state.
      valid_domains: Countdown/counter are observed u32; contact action/TTL/state are typed by the fixed record schema; pool slots are 0..63 and grain is u8.
      initialization: Verify pristine media and initialize private volley/contact state before save-qualified or resident readers execute; never infer identity from stale pool bytes.
      reset: Clear private volley ownership on boss reset/retry, player death/respawn, scene reload, overlay takeover and every scene transition.
      retirement: Release every injected contact exactly once before its pool slot, Thud overlay, boss, scene, HUD, renderer or audio owner unloads.
      consumers: Contact pool, player health/grain, rendering, effects, audio, boss phase/objective, retry, persistence, stages and overlays.
      capacity: Preserve the fixed 64-record pool and declare per-volley/per-emitter budgets without relying on native eviction or the observed ten-item loop.
      residency: The volley source is exact save-qualified Thud runtime; allocator/dispatch/grain paths are resident; contacts are transient pool state.
      unsafe_assumptions: Seven-by-ten and four-of-seven natural collection are not universal; one-health increments do not establish the full health/drop domain; equal frame with a -1-cycle branch delta is not cycle-neutral; Region-A addresses require exact media/save identity.
    confidence: confirmed
    residuals: Universal action-9 collection/drop policy, health-domain breadth, other attack sources, complete phase/lifecycle, named visuals/audio, objectives, retry and persistence remain open.
    supersedes:
      - The open claim that the recorded Thud fight's reward-contact frequency was unknown.
      - The open claim that no second countdown-selected reward variant was causally bound.
      - The open claim that this replay did not naturally collect an action-9 health leaf.

  - id: thud_action20_launch_sound
    provenance:
      media: Hash-verified pristine Disney-Pixar A Bug's Life v1.0 CUE and track; the centrally pinned Thud movie/state pair is pristine-classified and ALLMODS was not used as authority.
      executable: REBUILD/files/SCUS_942.88 SHA-256 1aa28954a1871d0799bf306a5ae746d17b143fce6d1965740f798862be519d20; resident play_sound 0x8005044C..0x800507F8 SHA-256 ffd93c418662e743429c966f4080065688227dcee6b17aab0ba4b21d383331b1.
      overlay: The exact 0x800B3FFC caller is qualified by the pinned save-owned Thud runtime image; play_sound is hash-pinned resident pristine code and no bare Region-A identity is generalized.
      assets: The external operator movie/state pair establishes the trigger and state anchor only; no copyrighted movie, save, disc, capture, sound, waveform, SPU RAM or other asset payload is retained.
      trigger: Replay the natural Thud recording from target 970 through target 980 with SPU tracing re-armed after state load, then reload the exact origin, replace only the 0x800B3FFC jal with a NOP, invalidate that code page and repeat.
      frame_or_cycle: Both branches begin at the same full-RAM/register/cycle/PC/SP origin and end at emulator frame 327724 / movie index 980 with equal frame/PC/SP and a measured one-cycle NOP-path delta; source attribution uses a separate ten-frame interpreter window.
      observation: The save-owned caller invokes play_sound once with a0=-14 and a1=0x8009FD84. The natural bounded SPU page has 13 events, including early 0x00009E10 key-ons at frames 327715/327716/327718/327720; the NOP page has seven events and no early key-on.
      inference: Thud's bound action-20 launch makes one actor-positioned negative cue request through resident play_sound and causes the measured emulated SPU key-on sequence; the cue is not a positive-id sfx_dispatch event in the attribution window.
      causal_confirmation: The mutation changes only the four nonzero bytes of the 0x0C014113 jal, acknowledges code invalidation, preserves the complete slot-17 record and gameplay endpoint, and removes six bounded SPU events including all four early 0x00009E10 key-ons.
      fixtures: [thud_boss_movie.movie.json, thud_boss_movie.movie.sav]
    machine:
      - config/phase4_thud.yaml
      - analysis/phase4_thud_defeat.json
      - tools/scenarios/duckstation/pristine_thud_action20_sound_call_control.yaml
    evidence:
      - {artifact: analysis/phase4_thud_defeat.json, sha256: 74a2651cce32d860118adbc83f58ebaca7c1efa252ee205dbdce6ceece868338, json_path: static_census.pristine_executable.resident_slices.play_sound.sha256, op: eq, expected: ffd93c418662e743429c966f4080065688227dcee6b17aab0ba4b21d383331b1}
      - {artifact: analysis/phase4_thud_defeat.json, sha256: 74a2651cce32d860118adbc83f58ebaca7c1efa252ee205dbdce6ceece868338, json_path: action20_sound_attribution.caller.instruction_pc, op: eq, expected: '0x800b3ffc'}
      - {artifact: analysis/phase4_thud_defeat.json, sha256: 74a2651cce32d860118adbc83f58ebaca7c1efa252ee205dbdce6ceece868338, json_path: action20_sound_attribution.request.signed_cue, op: eq, expected: -14}
      - {artifact: analysis/phase4_thud_defeat.json, sha256: 74a2651cce32d860118adbc83f58ebaca7c1efa252ee205dbdce6ceece868338, json_path: action20_sound_control.event_comparison.natural_total, op: eq, expected: 13}
      - {artifact: analysis/phase4_thud_defeat.json, sha256: 74a2651cce32d860118adbc83f58ebaca7c1efa252ee205dbdce6ceece868338, json_path: action20_sound_control.event_comparison.call_nop_total, op: eq, expected: 7}
      - {artifact: analysis/phase4_thud_defeat.json, sha256: 74a2651cce32d860118adbc83f58ebaca7c1efa252ee205dbdce6ceece868338, json_path: action20_sound_control.event_comparison.natural_early_key_ons.0.start_address, op: eq, expected: '0x00009e10'}
    guard: tests/test_phase4_thud_defeat.py::test_action_20_launch_sound_request_and_spu_key_ons_are_causal
    knowledge:
      canon: ObsidianVault/Canon/Systems/SYS_thud_natural_defeat.md
      experiment: ObsidianVault/Experiments/Runtime Tests/EXP_2026-07-16_phase4_thud_natural_defeat.md
      mods:
        not_applicable: true
        reason: This finding records pristine original-game behavior and adds no MOD-private hook, cave, state or intended behavior.
    mod_contract:
      owner: Preserve the save-qualified Thud launch caller, resident play_sound interface and SPU voice lifecycle; explicitly name every hook and cue replacement.
      readers: Enumerate cue id/sign domain, context pointer, play_sound tables, voice allocator, SPU registers/RAM, mixing, host audio, boss phase, retry and transition consumers.
      writers: Do not add unordered writes to cue tables, voice state, SPU key masks, sample addresses, action-20 launch state or scene/overlay teardown paths.
      valid_domains: The observed cue is signed -14 at the caller but transported as u32 0xFFFFFFF2; SPU sample addresses are emulated 32-bit byte addresses and voice ids are 0..23.
      initialization: Verify pristine media and initialize any private cue/sample/voice state before the save-qualified caller or resident audio path reads it.
      reset: Clear private audio ownership on voice completion/key-off, boss reset/retry, death/respawn, scene reload, overlay takeover and every scene transition.
      retirement: Release each injected cue, voice and sample owner exactly once before its Thud overlay, SPU bank, scene or host-audio owner unloads.
      consumers: Thud attack policy, play_sound, SFX/music tables, SPU voices/RAM, mixer, host audio, rendering, objectives, retry, persistence, stages and overlays.
      capacity: Preserve 24 SPU voices and bounded SPU RAM/event capacity; declare voice stealing, sample residency and per-emitter budgets for every addition.
      residency: The caller is save-qualified Thud runtime code; play_sound is resident; the measured SPU events and voices are transient runtime state.
      unsafe_assumptions: The sample start address is not a named asset or waveform; SPU completed is not host drain; one launch window is not general E12 coverage; equal gameplay state does not make the one-cycle control timing neutral.
    confidence: confirmed
    residuals: Named sound-asset/waveform identity, host-buffer drain, natural-hit frequency, other boss attacks, general E12 audio policy, complete arena/phase policy, objectives, retry and persistence remain independent open boundaries.
    supersedes:
      - The open claim that no sound request or SPU key-on sequence was assigned to the bound Thud action-20 launch.
      - Any inference that the shared background/completion SPU events alone establish the launch cue.

  - id: thud_action20_textured_billboard
    provenance:
      media: Hash-verified pristine Disney-Pixar A Bug's Life v1.0 CUE and track; the centrally pinned Thud movie/state pair is pristine-classified and ALLMODS was not used as authority.
      executable: REBUILD/files/SCUS_942.88 SHA-256 1aa28954a1871d0799bf306a5ae746d17b143fce6d1965740f798862be519d20; resident renderer 0x80014844..0x80014AD4 SHA-256 7fa7b409bac944db9fb8a779fe26d9965930b9ca986002f8e849875ff2e36a0e.
      overlay: The source countdown and action-20 allocation are save-qualified Thud-overlay behavior; the contact-record renderer and picked packet writer are hash-pinned resident pristine code, never a bare Region-A identity.
      assets: The external operator movie/state pair establishes the trigger and state anchor only; no copyrighted movie, save, disc, framebuffer, PNG, capture, texture, model, sound or other asset payload is retained.
      trigger: Replay the natural Thud recording from target 970 through target 980, then reload the exact origin, set only derived countdown 0x800B4CB4 from 9 to zero to suppress the action-20 source allocation, and compare the equal-frame/equal-cycle framebuffer in memory.
      frame_or_cycle: Both branches begin with full RAM/register/cycle equality and end at emulator frame 327724 / movie index 980 with equal cycle and SP; expected control-flow divergence leaves different PCs. Renderer attribution separately covers frames 327716 and 327722 in interpreter mode.
      observation: Suppression removes exactly 593 pixels in one 28x35 box. The natural object pick at native coordinate 295,65 selects a 4bpp textured quad with exact DMA source 0x001CF3D4, while no image bytes are retained.
      inference: The Thud-owned action-20 contact object has one measured presentation through the resident contact-record billboard renderer; texture/model asset identity and other visual variants remain unassigned, while launch sound is owned by a separate finding.
      causal_confirmation: The one-byte-effective u32 countdown control removes the visual region at an equal frame/cycle. Twenty-two exact renderer reads bind slot 17 active/flags/XYZ/size/action/subtype/mode/command-color fields, and a complete 16-write packet window binds the picked DMA packet to resident writer PCs 0x80014A30..0x80014A6C.
      fixtures: [thud_boss_movie.movie.json, thud_boss_movie.movie.sav]
    machine:
