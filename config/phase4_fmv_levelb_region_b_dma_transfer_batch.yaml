  - <<: *transfer_job
    id: levelb_region_b_transfer_repeat
    instrumentation: *transfer_instrumentation
    run: *transfer_run
    capture: *transfer_capture

control_pairs:
  - positive_job: levelb_region_b_transfer_native
    negative_job: levelb_region_b_transfer_repeat
