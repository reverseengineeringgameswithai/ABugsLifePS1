ownership_boundaries:
  owned_now:
    - Natural Bug Bar contact trigger from final playable life through the resident game-over selector.
    - Single-byte distinction between final-life game over and same-scene ordinary respawn.
    - Ordinary respawn health restore to 4 and lives decrement by one at exact resident writers.
    - Fourth-Start post-game-over title restart through scene-config lives reset from 0 to 5; removing Start refuses the restart.
    - The title-restart path leaves the exact 336-byte native progress block and fresh isolated memory card byte-identical; lives is outside that serialized block.
    - Existing LEVEL02 pit input provides a second-stage natural 3/5 to 4/4 death/reset class; the movement-neutral control prevents respawn.
    - On the ordinary Bug Bar contact path, C15's single-variable control proves that the same resident respawn handler consumes retained safe XYZ before completing the C16 health/lives 4/0 reset.
    - Eight existing natural damage leads now retain exact first transition-producer calls plus three nonfatal boundaries, four exact ordinary-respawn paths and one exact final-life selector path across scene values 3, 4, 6, 10 and 12 without assigning hazard kinds or actors from filenames.
    - The existing Hopper-showdown pair adds a verified scene-15 boss-context final-life path: proximity-contact JAL 0x8004B4A0 causes health 0 to -1 and selects resident game over while lives stays 0. It does not assign the damage to Hopper or complete D20/F15.
    - The existing Bonus-3 pair adds a verified scene-3 context ordinary-death path: a one-byte true-health control makes the same native proximity-contact invocation produce health -1/master state 2, then resident respawn restores health 4 and decrements lives 5 to 4. It assigns no named enemy and does not complete F18.
    - The complete Thumper pair adds a scene-2 actor-owned boss attack: natural and one-field-fatal controls enter the identical proximity call with s1 naming live pool slot 1/id 16/Thumper callback and backlink; the fatal branch reaches ordinary respawn health/lives 4/3. It does not complete D16 or F03.
    - The complete Thud pair adds a scene-14 boss-arena final-life control: row 4 is the sole in-threshold arena row, and the identical 0x800B4AE0 resident-damage call changes health 3 to 2 naturally or 0 to -1/master state 2 after a one-byte health-only control while lives remains 0. It does not establish a new death class or complete D18/F09.
    - The pristine Riverbed Flight anchor adds one scene-8 actor-owned proximity contact: corrected pool slot 5/id 37/callback 0x80049E88/backlink 0x80094AC4 calls the ordinary resident damage law and respawns at health/lives 4/2. A matched one-byte response-only control suppresses damage with identical frame/cycle/PC/SP. Type word 0x0125 remains unclassified and does not complete C16/F14.
  still_open:
    - C15 broader authored respawn-row and overlay selector policy.
    - Hazard-kind and remaining actor/script ownership plus scripted, setpiece and exceptional death classes and other bonus contexts; bounded Thumper, Thud-row-4 and Riverbed-Flight actor paths do not complete their campaign owners, and the Bonus-3 context path assigns no named enemy or F18 behavior.
    - Explicit native Save/Load after game over, no-card/corrupt-card behavior and other title/menu branches.
    - Remaining campaign-stage and transition breadth beyond the retained five-scene death-law join.
  dependency_boundary: >-
    C15 owns checkpoint source/capture/restore, E10 owns hazard-family outcomes,
    E14 owns card serialization, E15 owns FMV playback, and E16 owns overlay
    loading. Their interfaces are dependencies and do not confer C16 completion.

mod_contract:
  owner: Preserve the resident damage, scene-flow, respawn, scene-config and gameplay-reset order; explicitly name every hook.
  readers: Enumerate health/lives readers in damage, HUD, scene flow, respawn, scene config, persistence, results and frontend code before changing state.
  writers: Do not write health, lives, master state, fade timer, checkpoint anchors or scene configuration outside their native lifecycle or an explicitly reset MOD-private owner.
  valid_domains: Health is signed s16 and death begins below zero; lives is u8 with zero as a playable final life; post-game-over title-restart scene configuration supplies the observed value 5.
  initialization: Verify pristine executable/media identity and initialize scene configuration before player, HUD or transition consumers run.
  reset: Clear damage and transition state on respawn, post-game-over title restart, scene reload, save-state load and every frontend transition.
  retirement: Retire death/game-over callbacks and transient overlay references before respawn, title restart or scene replacement completes.
  consumers: Player controller, contact/hazard producers, checkpoint system, HUD/results, frontend, FMV, card persistence and scene/overlay loading.
  capacity: Preserve native u8 lives and signed-s16 health domains; any extension needs explicit saturation, serialization and display policy.
  residency: The retained functions and typed fields are resident; game-over FMV and scene overlays remain independently residency-qualified.
  unsafe_assumptions: >-
    A serial, filename, health poke, lives poke, one contact death, five natural
    multi-scene death-law joins, one unidentified boss-context death, one
    actor-owned Thumper attack, one Bonus-3 context death, one Thud row-4 arena
    contact, one Riverbed Flight actor contact, one title restart,
    Phase-2 stage matrix, or card serializer xref does not prove checkpoint
    coupling, trigger identity, every death class, frontend choice policy, save
    effects or all-stage breadth.

