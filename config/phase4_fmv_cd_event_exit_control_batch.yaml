      From the identical inspected E15 movie-start-state anchor, both branches
      advance input and guest execution to frame 250 before observation. The
      positive branch changes only 0x800B7420 from the resident-field load to
      addiu v0,zero,1; the native negative retains the original word. Before
      the movie's frame-334 Start input, only the positive may reach the
      CdControl(0x0B), StClearRing and callback-teardown sequence. A second
      changed word, observer saturation or teardown in the negative rejects
      the interface claim.

