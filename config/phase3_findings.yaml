  - id: player_and_contact_integrators
    title: Player/contact velocity triples, contact gravity, and the speed field
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: [red_berry_thrown.sav]
      note: >
        stage anchor save taken from analysis/phase2_stage_baseline.json (hash-pinned
        there); the berry's known 128/frame^2 fall law is the BUILT-IN CONTROL - a run
        that cannot rediscover gravity from the bytes must not be trusted.
    machine: [config/record_types.yaml, config/semantic_state.yaml]
    evidence: analysis/phase3_unknown_fields.json
    command: python3 tools/phase3_unknown_fields.py
    guard: tests/test_phase3_records.py::test_velocity_fields_and_ttl_are_typed
    canon: ObsidianVault/Canon/Systems/SYS_record_layouts_and_lifetimes.md
    mod_contract: >
      Player velocity = +0x2C/+0x30/+0x34 (s32, record-relative; absolute 0x800A652C/
      30/34); contact velocity = +0x0C/+0x10/+0x14 with gravity_per_tick +0x18 = 128.
      A velocity is a MOVE PROPOSAL: the integrator may CLAMP the resulting position
      (collision/ground), so writing a velocity does NOT guarantee the move. The
      contact velocity is PRE-INTEGRATED (at tick t it already holds tick t+1's delta).
      UNSAFE ASSUMPTION TO AVOID: that player +0x30 is a "knockback" field - it is the
      vertical VELOCITY; the on-hit -1024 write is just one writer.
    supersedes:
      - "player 0x800A6530 named 'knockback_velocity' (it is velocity_y; knockback is
         a vertical impulse INTO it)"
    residuals: >
      player +0x38 tracks hypot(vx,vz) to ~1 unit but the exact formula is unproven
      (runtime_seen, not confirmed). player +0x20/21 and +0x28/29 still unknown.

