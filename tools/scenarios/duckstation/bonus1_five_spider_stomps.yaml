schema_version: 1
id: bonus1_five_spider_stomps
description: Five Training spider butt-slams unlock Bonus 1 and hand off to scene 0x10.
target:
  disc: "Disney-Pixar A Bug's Life (v1.0).cue"
  expected_serial: SCUS-94288
  expected_sha256: 463102187c2ada6ac90c2990e23cdaf2ef9f8eb56a95a57d8ab496248571d644
launch: {profile: repro}
playback:
  movie: movies/Bonus_Level_01.movie.json
  load_start_state: true
  require_reproducible: true
phases:
  - id: four_stomps
    trigger: {type: movie_frame, target: 750, max_frames: 1000, timeout_seconds: 120}
    assertions:
      - {id: bonus1_scene_is_training, type: memory, address: 0x80082504, width: u32, op: eq, expected: 0x11, semantic_id: original.current_scene_id}
      - {id: bonus1_streak_is_four, type: memory, address: 0x8008223C, width: u32, op: eq, expected: 4, semantic_id: original.bonus1_stomp_streak}
      - {id: bonus1_not_latched_early, type: memory, address: 0x800823A0, width: s16, op: eq, expected: 0, semantic_id: original.bonus_transition_latch}
  - id: fifth_stomp_unlocks
    trigger: {type: movie_frame, target: 1250, max_frames: 750, timeout_seconds: 120}
    assertions:
      - {id: bonus1_enters_bonus_scene, type: memory, address: 0x80082504, width: u32, op: eq, expected: 0x10, semantic_id: original.current_scene_id}
      - {id: bonus1_success_resets_streak, type: memory, address: 0x8008223C, width: u32, op: eq, expected: 0, semantic_id: original.bonus1_stomp_streak}
      - {id: bonus1_transition_is_six, type: memory, address: 0x800823A0, width: s16, op: eq, expected: 6, semantic_id: original.bonus_transition_latch}
      - {id: bonus1_unlock_bit_set, type: memory, address: 0x8009B889, width: u8, op: eq, expected: 0x02, semantic_id: original.bonus_unlock_flags}
  - id: bonus_wrapper_returns_to_menu
    trigger: {type: movie_frame, target: 3653, max_frames: 2600, timeout_seconds: 240}
    assertions:
      - {id: bonus1_returns_to_journey_menu, type: memory, address: 0x80082504, width: u32, op: eq, expected: 0x00, semantic_id: original.current_scene_id}
      - {id: bonus1_earned_guard_is_committed, type: memory, address: 0x8009B889, width: u8, op: eq, expected: 0x22, semantic_id: original.bonus_unlock_flags}
