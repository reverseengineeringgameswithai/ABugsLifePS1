  rows:
    - row_id: E15_fmv
      queue_rank: 5
      classification: offline_partial
      completion_state: open
  selection_reason: >
    No offline-ready or live-required row exists. E15 is the highest-ranked
    unconsumed partial campaign. Higher-ranked C16/C15 have already been repeatedly
    deepened, E08 was consumed in iteration 71, and E10 already consumed its complete
    13-capsule cluster. The original E15 selection had one capsule and nine exact
    scheduled queries. Its current cross-system lifecycle frontier additionally owns
    the centrally pinned C16 LOSE capsule, so this refreshed contract must preserve
    two capsules and all 18 current queries.
