  - id: camera_is_a_derived_output
    title: The camera struct is a DERIVED OUTPUT (both triples decay when poked)
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: []
      note: >
        stage01 anchor from analysis/phase2_stage_baseline.json (hash-pinned in the
        artifact); Phase-2 already proved the struct moves under L1 and is static
        under no input.
    machine: [config/record_types.yaml, analysis/phase3_camera_record.json]
    evidence: analysis/phase3_camera_record.json
    command: python3 tools/phase3_camera_record.py
    guard: tests/test_phase3_camera.py
    canon: ObsidianVault/Canon/Systems/SYS_record_layouts_and_lifetimes.md
    mod_contract: >
      camera_pos +0x00 (s32 x3) and camera_target +0x0C (s32 x3) at 0x80095358, written
      by camera_follow_update 0x8004DF18. The position exponentially chases the target,
      closing ~0.15 of the gap per frame. UNSAFE ASSUMPTION TO AVOID: that writing this
      struct moves the camera - it does NOT. Poking camera_pos is pulled back by the
      follow law; poking camera_target is recomputed away next tick. The struct is an
      OUTPUT: to move the camera a mod must change the producer (0x8004DF18) or the
      inputs it reads. Reading the struct is safe; writing it is theatre.
    supersedes:
      - "the assumption that the camera's second triple is a prev-tick mirror (it is
         the TARGET; it never equals the previous camera_pos nor the player position)"
    residuals: >
      camera +0x18..0x5F is still unknown (varying s16s at +0x18, +0x24, +0x2A). The
      rotation/yaw representation and the target's own derivation from player state are
      unproven.

  - id: render_descriptors_are_loader_patched
    title: Object render descriptors — stable pointers, scene-dependent post-load bytes
    confidence: partial
    provenance:
      media: pristine SCUS-94288
      fixtures: []
      note: >
        all 42 centrally declared, hash-pinned strict-pristine anchors (pinned in
        the artifact). The former Training save is rejected as non-pristine because
        its embedded media was ALLMODS. This table is
        NOT in the EXE - it is RAM/BSS filled at load time, which is exactly why the
        dispatch map deferred it to a live enumeration.
    machine: [analysis/phase3_render_descriptors.json]
    evidence: analysis/phase3_render_descriptors.json
    command: python3 tools/phase3_render_descriptors.py
    guard: tests/test_phase3_render_descriptors.py
    canon: ObsidianVault/Canon/Systems/SYS_record_layouts_and_lifetimes.md
    mod_contract: >
      object_pointer_list 0x80096B98 maps kind (0..49) -> a 0xC-byte descriptor. The
      POINTERS are identical in every level, and descriptors are SHARED (kinds 0 and 1
      point at the same one) and NOT a contiguous array (variable stride) - so a mod
      must follow the pointer, never index a base by kind*0xC. Observed invariant
      bytes are +0x00,+0x01,+0x02,+0x03,+0x05,+0x09,+0x0B. Post-load values at
      +0x04,+0x06,+0x07,+0x08,+0x0A vary across anchors
      (+0x04/+0x06 vary for all 50 kinds). UNSAFE ASSUMPTION TO AVOID: treating
      any scene-dependent byte as a durable one-time edit, or claiming the loader
      wrote it from cross-anchor snapshots alone. Re-apply only after the owning
      writer/lifetime is traced; do not patch an inferred loader.
      The former +0x00,+0x02,+0x03,+0x09 changes were ALLMODS contamination,
      not original-game behavior, and are superseded by the strict-pristine census.
    supersedes:
      - "the assumption that a kind -> descriptor edit is a one-time global change"
      - "the overclaim that only CLUT/texpage vary, all identity/geometry bytes are
         stable, and the loader writer was already causally traced"
    residuals: >
      Writer causality is open. loadState restores post-load RAM and clears watches,
      so the current census cannot identify which loader/fixup/runtime instruction
      writes the varying bytes. Next: cold-boot or transition with a write watch over
      0x80081D98..0x80082060 and bank instruction-attributed PCs. Field meanings beyond
      the sprite examples remain inferred; non-sprite renderers are uncharacterised.

  - id: sfx_dispatch_interface
    title: sfx_dispatch (0x80050994) — a callable "play a sound" interface, and its trap
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: []
      note: >
        stage01 anchor (hash-pinned in the artifact). Every id is invoked from a FRESH
        loadState on an isolated instance, because debugger.callFunction really runs
        guest code and mutates state.
    machine: [analysis/phase3_sfx_interface.json]
    evidence: analysis/phase3_sfx_interface.json
    command: python3 tools/phase3_sfx_interface.py
    guard: tests/test_phase3_sfx_interface.py
    canon: ObsidianVault/Canon/Systems/SYS_record_layouts_and_lifetimes.md
    mod_contract: >
      sfx_dispatch(a0 = sfx id) plays a sound; the id is SIGNED (the carried- and
      dropped-seed impact arms both pass a0 = -4). Swept -24..48 on pristine: 27 ids
      key a voice on, each starting a DISTINCT sample (no aliases in that range).
      UNSAFE ASSUMPTION TO AVOID: branching on the return value. v0 is NOT a success
      flag - it reads 0x4 for every id that PLAYS and ALSO for 36 ids that stay
      SILENT (a few invalid ids return junk). "It returned 4, so it worked" is exactly
      the wrong inference: only the SPU (a voice keying on) proves a sound started.
      The function is safe to call from a paused guest and really does produce audio.
    supersedes: []
    residuals: >
      a1..a3 were held at 0 - their meaning (volume? position? voice hint?) is
      uncharacterised. Ids outside -24..48 are unscanned, and the id -> sound NAME
      mapping is not established (only id -> distinct sample address).

  - id: jr_dispatch_frontier_resolved
    title: The 94-site jr frontier — 36 tables decoded, 45 were never tables at all
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: [REBUILD/files/SCUS_942.88]
    machine: [analysis/phase3_jr_tables.json]
    evidence: analysis/phase3_jr_tables.json
    command: python3 tools/phase3_jr_tables.py
    guard: tests/test_phase3_jr_tables.py
    canon: ObsidianVault/Canon/Systems/SYS_indirect_dispatch_map.md
    mod_contract: >
      36 jump tables recovered by backward-slicing the compiler idiom (sltiu bound /
      sll scale / lui+addu base / lw / jr): 869 entries, ALL of which land in named
      functions. A mod adding a handler must raise the sltiu BOUND, not merely append
      to the table - the bound is what makes an index reachable. UNSAFE ASSUMPTION TO
      AVOID: that every `jr <reg>` is a table dispatch. 45 of the 95 sites jump INTO
      CODE (base + index<<k - unrolled loops / jump islands, heavy in the GTE paths):
      there is NO table there to patch, and writing to the address the slicer would
      have "recovered" would corrupt code.
    supersedes:
      - "the dispatch map's framing of '94 jr sites with undecoded tables' as the WP4
         frontier - most of them never had a table"
    residuals: >
      14 sites remain unresolved: 8 whose jr register is defined by opcode 0x0D (ori -
      likely constant targets), 2 with no plausible sltiu bound, 2 whose decoded entries
      fall outside censused code (a wrong slice, deliberately NOT reported as a table),
      1 addu of two non-shifted values, 1 gp-relative base.

  - id: jalr_callback_slots
    title: Indirect CALL sites — 30 global callback slots (the real hook mechanism)
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: [REBUILD/files/SCUS_942.88]
      note: >
        static classification from the pristine EXE; the installed handlers are read
        LIVE at the stage01 anchor (hash-pinned in the artifact).
    machine: [analysis/phase3_jalr_callbacks.json]
    evidence: analysis/phase3_jalr_callbacks.json
    command: python3 tools/phase3_jalr_callbacks.py
    guard: tests/test_phase3_jalr_callbacks.py
    canon: ObsidianVault/Canon/Systems/SYS_indirect_dispatch_map.md
    mod_contract: >
      Of 139 indirect calls: 99 go through 30 GLOBAL CALLBACK SLOTS, 36 through
      FUNCTION-POINTER FIELDS of records (offsets +0x8, +0x10, +0x14, +0x0 ... - a
      typed-record fact), 4 unresolved. A slot is the game's own hook mechanism: write
      a pointer into it and the call is redirected WITHOUT patching a single
      instruction - far safer than a code cave. Installed at stage01: trapIntrVSync
      (0x80080EBC), def_cbsync (0x800818C4), def_cbread (0x80081BDC), music_loop_poll
      (0x800818C8), printf (0x8007FBC4), the pad_direct_* family (0x80081CF0..0x80081D74),
      _dws (0x800A65D8). UNSAFE ASSUMPTIONS TO AVOID: (1) that a slot holding NULL is a
      "free hook" - whether the call site guards against NULL is UNVERIFIED, and calling
      through a slot a mod half-installs will jump to garbage; (2) that any slot may be
      redirected casually - trapIntrVSync/def_cbsync/def_cbread run in INTERRUPT
      CONTEXT, so a replacement must be interrupt-safe and preserve the original ABI;
      (3) that these handlers are constant - they were read at ONE anchor and may be
      re-installed per scene.
    supersedes: []
    residuals: >
      NULL-guard behaviour at each call site is unverified. Handlers were resolved at a
      single anchor - a per-scene sweep would show which slots are re-installed on load.
      The 36 function-pointer struct fields are not yet attributed to their owning
      record types.

  - id: actor_event_callback_field
    title: actor_record +0x7C is a per-actor EVENT CALLBACK (function pointer)
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: []
      note: >
        all 42 centrally declared strict-pristine anchors (pinned in the artifact); 1286 live actor
        instances sampled. Cross-referenced with analysis/phase3_jalr_callbacks.json,
        which independently shows a jalr calling through a struct field at +0x7C.
    machine: [config/record_types.yaml, analysis/phase3_fn_ptr_fields.json]
    evidence: analysis/phase3_fn_ptr_fields.json
    command: python3 tools/phase3_fn_ptr_fields.py
    guard: tests/test_phase3_fn_ptr_fields.py
    canon: ObsidianVault/Canon/Systems/SYS_record_layouts_and_lifetimes.md
    mod_contract: >
      actor_record +0x7C (u32) is a FUNCTION POINTER the game calls through (a jalr at
      that offset). Observed handlers are effect/sound callbacks: enemy_strike_contact_effect,
      actor_sound40_on_low_state, mosquito_species_callback, aimed_object_spawn_sfx,
      play_object_sound_42, actor_event_sound_trigger. A mod can give an actor new
      behaviour by installing a pointer here - PER ACTOR, without touching code.
      UNSAFE ASSUMPTIONS TO AVOID: (1) that the field is always populated - only 61% of
      live actor instances hold a callback, so the other 39% have NONE and any caller
      must null-check; (2) that an installed pointer persists - actor records are
      rebuilt from level data on every load (see the transition finding), so a mod must
      re-install after the world is ready, not when the scene id flips; (3) that the
      handler's ABI is free - it is called with the engine's own argument convention,
      which is not yet characterised.
    supersedes: []
    residuals: >
      The callback's ABI (arguments, return, whether it may block) is uncharacterised.
      The remaining jalr struct-field offsets (+0x0, +0x4, +0x8, +0xC, +0x10, +0x14,
      +0x18, +0x28, +0x2C, +0x34, +0x38, +0x3C) belong to records NOT yet typed - they
      are the natural next targets for WP5.

  - id: static_reader_writer_xrefs
    title: Static data xrefs — readers/writers for owned state, and what a static scan CANNOT see
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: [REBUILD/files/SCUS_942.88]
    machine: [analysis/phase3_xrefs.json]
    evidence: analysis/phase3_xrefs.json
    command: python3 tools/phase3_xrefs.py
    guard: tests/test_phase3_xrefs.py
    canon: ObsidianVault/Canon/Systems/SYS_record_layouts_and_lifetimes.md
    mod_contract: >
      For every owned semantic address, the instructions that READ and WRITE it, resolved
      from the pristine image (gp-relative via gp=0x80081D98, and lui-formed absolute).
      38/58 owned entries have static xrefs. THE LOAD-BEARING CAVEAT: 20369 of 26557
      loads/stores go through a RUNTIME POINTER and cannot be resolved statically at all.
      UNSAFE ASSUMPTION TO AVOID: reading "no xrefs" as "nothing touches this". It does NOT
      mean that - it means either (a) the state is a TABLE read by INDEX (base + idx*4),
      whose consumers are enumerated in the dispatch map, or (b) it is reached through a
      pointer / written by overlay or mod code outside this image. Every such entry carries
      an explicit `no_static_xref_because` saying which.
    supersedes:
      - "the registry's 43 hand-curated `writers`, which were never checked against the
         image; they are now VERIFIED (0 real contradictions: 6 are pointer-based writes the
         method cannot see, 1 lives in overlay space outside the resident EXE)"
    residuals: >
      Pointer-based accesses (the majority) need a dynamic complement - the DuckStation fork
      has accessLog/xrefsTo, but accessLog is dead under CachedInterpreter, so this needs a
      different lane. Overlay code is not scanned (it is not in the resident image).

  - id: hook_continuation_contracts_machine_checked
    title: Hook continuation contracts, machine-checked (gate bullet 4)
    confidence: confirmed
    provenance:
      media: pristine SCUS-94288
      fixtures: [REBUILD/files/SCUS_942.88]
      note: the corpus is the 15 hooks declared in mod/hook_caves.yaml (shipped mods).
    machine: [analysis/phase3_hook_contracts.json]
